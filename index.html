<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hardwood Life · NBA 球隊需求選秀版</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#0b1220;color:#f4f2ec;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
body{min-height:100vh;background:radial-gradient(900px 500px at 50% -10%,#1c2f51 0%,transparent 60%),#0b1220}
#talent-screen{max-width:520px;margin:0 auto;padding:22px 14px 40px}
.hero{text-align:center;padding:12px 8px 18px}
.hero h1{font-size:27px;margin:0 0 7px}
.hero p{margin:0;color:#9db0cc;font-size:13px;line-height:1.55}
.mode-box{margin-bottom:14px;padding:12px;border:1px solid #2a3a57;border-radius:14px;background:#101a2d}
.mode-title{font-weight:900;font-size:15px;margin-bottom:8px}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode-btn{border:1px solid #2a3a57;border-radius:11px;background:#131e33;color:#f4f2ec;padding:11px 8px;font-weight:800;font-size:12px}
.mode-btn.on{border-color:#f2b84b;box-shadow:0 0 14px rgba(242,184,75,.25)}
.mode-desc{font-size:10.5px;color:#9db0cc;margin-top:8px;line-height:1.5}
.legend{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:11px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.card{border:1px solid #2a3a57;background:#131e33;border-radius:14px;padding:11px 9px;color:#f4f2ec;text-align:left;min-height:92px}
.card .rarity{font-size:10px;font-weight:900;margin-bottom:3px}
.card .name{font-size:14px;font-weight:900}
.card .desc{font-size:10.5px;line-height:1.4;color:#9db0cc;margin-top:5px}
.card.on{background:#1b2842;transform:translateY(-1px)}
#selected{margin:12px 0;background:#101a2d;border:1px solid #2a3a57;border-radius:13px;padding:12px;font-size:12px;line-height:1.6;color:#9db0cc}
#selected b{font-size:15px}
#go{width:100%;border:0;border-radius:13px;background:#ff6a2c;color:#1c0d04;font-size:16px;font-weight:900;padding:14px}
#go:disabled{opacity:.5}
#loading{display:none;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:24px;line-height:1.7}
.person-box{margin:14px 0;padding:12px;border:1px solid #2a3a57;border-radius:14px;background:#101a2d}
.person-title{font-weight:900;font-size:15px;margin-bottom:8px}
.person-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.person-btn{border:1px solid #2a3a57;border-radius:10px;background:#131e33;color:#f4f2ec;padding:9px 7px;font-size:11px;font-weight:800;text-align:left}
.person-btn.on{border-color:#4DA3FF;box-shadow:0 0 12px rgba(77,163,255,.25);background:#1b2842}
.person-note{font-size:10.5px;color:#9db0cc;line-height:1.5;margin-top:8px}

</style>
</head>
<body>

<div id="talent-screen">
  <div class="hero">
    <h1>🌟 Hardwood Life 改造版</h1>
    <p>天才類型＋NBA 球隊需求選秀。<br>事件骰子仍固定為 6。</p>
  </div>

  <div class="mode-box">
    <div class="mode-title">🏀 生涯起點</div>
    <div class="mode-grid">
      <button id="mode-normal" class="mode-btn on" type="button">🏫 正常高中開始</button>
      <button id="mode-nba" class="mode-btn" type="button">🇺🇸 挑戰 NBA 選秀</button>
    </div>
    <div id="mode-desc" class="mode-desc">
      正常模式：從高中開始，照原版生涯流程遊玩。
    </div>
  </div>

  <div class="hero" style="padding-top:2px">
    <h1 style="font-size:22px">選擇球員天賦</h1>
    <div class="legend">
      <span style="color:#9DB0CC">一般</span>
      <span style="color:#4DA3FF">A</span>
      <span style="color:#A66CFF">S</span>
      <span style="color:#FF6A2C">SS</span>
      <span style="color:#F2B84B">傳奇</span>
    </div>
  </div>

  <div id="cards" class="grid"></div>

  <div class="person-box">
    <div class="person-title">🧠 球員性格</div>
    <div id="person-grid" class="person-grid"></div>
    <div id="person-note" class="person-note">目前：🎲 隨機性格</div>
  </div>

  <div id="selected">尚未選擇</div>
  <button id="go" disabled>選好後進入遊戲 🏀</button>
</div>

<div id="loading">正在載入遊戲…</div>

<script>
const SOURCE='https://raw.githubusercontent.com/a3283249-droid/hardwood-life/main/index.html';

const TALENTS=[
  {id:'normal',rarity:'一般',name:'⚪ 一般選手',color:'#9DB0CC',
   desc:'原版隨機潛力',detail:'原版能力與隨機潛力。直接挑戰 NBA 時很可能落選。'},
  {id:'scorer',rarity:'A',name:'🔥 得分機器',color:'#4DA3FF',
   desc:'得分特化',detail:'潛力 91｜得分 +11｜三分 +5｜每季得分 +1｜訓練點 +1'},
  {id:'sniper',rarity:'A',name:'🎯 神射手',color:'#4DA3FF',
   desc:'外線特化',detail:'潛力 91｜三分 +13｜得分 +5｜每季三分 +1｜訓練點 +1'},
  {id:'rebounder',rarity:'A',name:'🧲 籃板怪獸',color:'#4DA3FF',
   desc:'禁區籃板特化',detail:'潛力 91｜籃板 +14｜防守 +6｜每季籃板 +1｜訓練點 +1'},
  {id:'playmaker',rarity:'S',name:'🧠 球場魔術師',color:'#A66CFF',
   desc:'組織與球商',detail:'潛力 94｜組織 +12｜球商 +9｜每季組織、球商 +1｜訓練點 +2'},
  {id:'lockdown',rarity:'S',name:'🛡️ 防守怪物',color:'#A66CFF',
   desc:'鎖防特化',detail:'潛力 94｜防守 +13｜體能 +6｜每季防守 +1｜訓練點 +2'},
  {id:'athlete',rarity:'SS',name:'🚀 運動怪物',color:'#FF6A2C',
   desc:'爆發力與體能',detail:'潛力 96｜體能 +14｜防守/籃板 +4｜每季體能 +1｜訓練點 +3'},
  {id:'pointgod',rarity:'SS',name:'👑 控衛之神',color:'#FF6A2C',
   desc:'控場與外線',detail:'潛力 96｜組織 +11｜球商 +9｜三分 +7｜每季組織、三分 +1｜訓練點 +3'},
  {id:'twoway',rarity:'SS',name:'⚔️ 攻防一體',color:'#FF6A2C',
   desc:'攻防兼備',detail:'潛力 96｜得分 +7｜防守 +9｜體能 +6｜每季得分、防守 +1｜訓練點 +3'},
  {id:'allround',rarity:'傳奇',name:'🃏 全能天才',color:'#F2B84B',
   desc:'全面型怪物',detail:'潛力 98｜全部能力 +7｜每季球商、體能 +1｜訓練點 +4'},
  {id:'chosen',rarity:'傳奇',name:'🌟 天選之子',color:'#F2B84B',
   desc:'最頂級全能天賦',detail:'潛力 99｜全部能力 +8｜每季得分、組織、防守、體能 +1｜訓練點 +4'}
];


const PERSONALITIES=[
  {id:"random",name:"🎲 隨機性格",desc:"建角時隨機決定。"},
  {id:"leader",name:"👑 領袖",desc:"更衣室影響力強，士氣較穩定。"},
  {id:"quiet",name:"🧊 沉默殺手",desc:"少說多做，球商與關鍵表現更穩。"},
  {id:"competitor",name:"🔥 好勝",desc:"競爭心強，容易搶到更高球隊角色。"},
  {id:"loyal",name:"❤️ 忠誠",desc:"較願意留隊，也更容易獲得母隊續約。"},
  {id:"teamfirst",name:"🤝 團隊至上",desc:"組織與球商成長較順。"},
  {id:"confident",name:"😎 自信",desc:"名氣與進攻表現容易被放大。"},
  {id:"hothead",name:"💢 火爆",desc:"防守與對抗更強，但交易與更衣室風險較高。"}
];
let selectedPersonality="random";

let selected=null;
let startMode='normal';

const modeNormal=document.getElementById('mode-normal');
const modeNBA=document.getElementById('mode-nba');
const modeDesc=document.getElementById('mode-desc');

function setMode(mode){
  startMode=mode;
  modeNormal.classList.toggle('on',mode==='normal');
  modeNBA.classList.toggle('on',mode==='nba');
  modeDesc.innerHTML=mode==='nba'
    ? '<b style="color:#F2B84B">挑戰模式：</b>建角後直接參加 NBA 選秀，但不保證中選。球隊會看 OVR、潛力、天賦與「陣容需求契合度」。能力太低會落選。'
    : '正常模式：從高中開始，照原版生涯流程遊玩。';
}
modeNormal.onclick=()=>setMode('normal');
modeNBA.onclick=()=>setMode('nba');

const cards=document.getElementById('cards');
const selectedBox=document.getElementById('selected');
const go=document.getElementById('go');

const personGrid=document.getElementById('person-grid');
const personNote=document.getElementById('person-note');
for(const p of PERSONALITIES){
  const b=document.createElement('button');
  b.type='button';
  b.className='person-btn'+(p.id==="random"?' on':'');
  b.dataset.pid=p.id;
  b.innerHTML='<div>'+p.name+'</div><div style="font-weight:400;color:#9db0cc;margin-top:2px">'+p.desc+'</div>';
  b.onclick=()=>{
    selectedPersonality=p.id;
    personGrid.querySelectorAll('.person-btn').forEach(x=>x.classList.toggle('on',x.dataset.pid===p.id));
    personNote.textContent='目前：'+p.name+'｜'+p.desc;
  };
  personGrid.appendChild(b);
}

for(const t of TALENTS){
  const b=document.createElement('button');
  b.className='card';
  b.type='button';
  b.dataset.id=t.id;
  b.innerHTML=
    '<div class="rarity" style="color:'+t.color+'">'+t.rarity+'</div>'+
    '<div class="name">'+t.name+'</div>'+
    '<div class="desc">'+t.desc+'</div>';
  b.onclick=()=>{
    selected=t;
    document.querySelectorAll('.card').forEach(x=>{
      x.classList.toggle('on',x.dataset.id===t.id);
      const tx=TALENTS.find(y=>y.id===x.dataset.id);
      x.style.borderColor=x.dataset.id===t.id?tx.color:'#2a3a57';
      x.style.boxShadow=x.dataset.id===t.id?'0 0 14px '+tx.color+'55':'none';
    });
    selectedBox.innerHTML='<b style="color:'+t.color+'">['+t.rarity+'] '+t.name+'</b><br>'+t.detail;
    go.disabled=false;
    go.textContent='使用 '+t.name+' 開始遊戲 🏀';
  };
  cards.appendChild(b);
}

function escJs(s){
  return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
}

go.onclick=async()=>{
  if(!selected)return;

  document.getElementById('talent-screen').style.display='none';
  const loading=document.getElementById('loading');
  loading.style.display='flex';
  loading.textContent='正在載入 '+selected.name+'…';

  try{
    const res=await fetch(SOURCE,{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    let source=await res.text();

    // 1) 事件骰子固定 6
    source=source.replace(/rint\s*\(\s*1\s*,\s*6\s*\)/g,'6');

    // 2) 起始能力加成
    source=source.replace(
      /ATTR_KEYS\.forEach\(k=>attr\[k\]=clamp\(Math\.round\(t\[k\]\*\.94\+rnd\(-5,5\)\),18,58\)\);/,
      `ATTR_KEYS.forEach(k=>attr[k]=clamp(Math.round(t[k]*.94+rnd(-5,5)),18,58));
      {
        const tt=window.__TALENT_TYPE__||"normal";
        const buffs={
          scorer:{shooting:11,three:5,athletic:3,iq:2},
          sniper:{three:13,shooting:5,iq:3},
          rebounder:{rebound:14,defense:6,athletic:4},
          playmaker:{pass:12,iq:9,shooting:2},
          lockdown:{defense:13,athletic:6,iq:4,rebound:2},
          athlete:{athletic:14,defense:4,rebound:4,shooting:2},
          pointgod:{pass:11,iq:9,three:7,shooting:3},
          twoway:{shooting:7,defense:9,athletic:6,iq:4},
          allround:{shooting:7,three:7,pass:7,defense:7,rebound:7,athletic:7,iq:7},
          chosen:{shooting:8,three:8,pass:8,defense:8,rebound:8,athletic:8,iq:8}
        };
        const b=buffs[tt];
        if(b)for(const k in b)if(k in attr)attr[k]=clamp(attr[k]+b[k],18,82);
      }`
    );

    // 3) 潛力
    source=source.replace(
      /potential:\(function\(\)\{let p=rint\(68,80\);if\(chance\(\.12\)\)p\+=rint\(6,15\);return clamp\(p,68,99\);\}\)\(\)/,
      `potential:(function(){
        const tt=window.__TALENT_TYPE__||"normal";
        const pm={scorer:91,sniper:91,rebounder:91,playmaker:94,lockdown:94,athlete:96,pointgod:96,twoway:96,allround:98,chosen:99};
        if(pm[tt])return pm[tt];
        let p=rint(68,80);if(chance(.12))p+=rint(6,15);return clamp(p,68,99);
      })()`
    );

    // 4) 天賦資料存檔
    source=source.replace(
      /name,pos,home,jersey:jn,/,
      `name,pos,home,jersey:jn,
      talentType:(window.__TALENT_TYPE__||"normal"),
      talentRarity:(window.__TALENT_RARITY__||"一般"),
      talentName:(window.__TALENT_NAME__||"一般選手"),
      personality:(function(){ const p=window.__PERSONALITY__||"random"; if(p!=="random")return p; const a=["leader","quiet","competitor","loyal","teamfirst","confident","hothead"]; return a[rint(0,a.length-1)]; })(),`
    );

    // 5) 稀有度訓練點
    source=source.replace(
      /return base \+ rint\(0,2\);/,
      `const rarityBonus={"一般":0,"A":1,"S":2,"SS":3,"傳奇":4}[G.talentRarity||"一般"]||0;
      return base + rint(0,2) + rarityBonus;`
    );

    // 6) 每季專屬成長
    source=source.replace(
      /function beginAllocate\(\)\{\s*let sp=computeSP\(\);/,
      `function beginAllocate(){
      if(G&&G.attr){
        const growth={
          scorer:{shooting:1},sniper:{three:1},rebounder:{rebound:1},
          playmaker:{pass:1,iq:1},lockdown:{defense:1},athlete:{athletic:1},
          pointgod:{pass:1,three:1},twoway:{shooting:1,defense:1},
          allround:{iq:1,athletic:1},chosen:{shooting:1,pass:1,defense:1,athletic:1}
        }[G.talentType||"normal"];
        if(growth)for(const k in growth)if(k in G.attr)G.attr[k]=Math.min(99,G.attr[k]+growth[k]);
      }
      let sp=computeSP();`
    );

    // 7) 插入 NBA 球隊需求 / 契合度模型
    const teamNeedHelpers = `
function _nbaNeedCatalog(){
  return [
    {id:"shooter",name:"外線射手",score:a=>a.three*.72+a.shooting*.28},
    {id:"defender",name:"外圍防守型",score:a=>a.defense*.72+a.athletic*.28},
    {id:"playmaker",name:"助攻控球",score:a=>a.pass*.68+a.iq*.32},
    {id:"bench",name:"替補爆發得分",score:a=>a.shooting*.52+a.three*.25+a.athletic*.23},
    {id:"rim",name:"護框長人",score:(a,p)=>a.defense*.55+a.rebound*.28+a.athletic*.17+((p==="C"||p==="PF")?7:0)},
    {id:"rebound",name:"籃板手",score:a=>a.rebound*.75+a.athletic*.25},
    {id:"3d",name:"3&D",score:a=>a.three*.45+a.defense*.45+a.athletic*.10},
    {id:"wing",name:"側翼得分",score:(a,p)=>a.shooting*.52+a.athletic*.28+a.three*.20+((p==="SG"||p==="SF")?5:0)},
    {id:"secondary",name:"第二持球點",score:a=>a.pass*.48+a.shooting*.30+a.iq*.22},
    {id:"switchbig",name:"可換防內線",score:(a,p)=>a.defense*.42+a.athletic*.34+a.rebound*.24+((p==="PF"||p==="C")?5:0)}
  ];
}
function _nbaHash(s){
  let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h+s.charCodeAt(i))|0;
  return Math.abs(h);
}
function nbaNeedsForTeam(team){
  const c=_nbaNeedCatalog(),h=_nbaHash(team||"NBA");
  const a=c[h%c.length],b=c[(Math.floor(h/7)+3)%c.length];
  return a.id===b.id?[a]:[a,b];
}
function nbaFitForTeam(team){
  const ns=nbaNeedsForTeam(team),a=G.attr,p=G.pos;
  const vals=ns.map(n=>n.score(a,p));
  const fit=Math.round(vals.reduce((x,y)=>x+y,0)/vals.length);
  return {team,needs:ns.map(x=>x.name),fit};
}
function nbaCandidateTeams(){
  const seen=new Set(),arr=[];
  for(let i=0;i<80&&arr.length<14;i++){
    const t=randTeam("NBA");
    if(!seen.has(t)){seen.add(t);arr.push(nbaFitForTeam(t));}
  }
  return arr;
}
function nbaBestTeamForPlayer(){
  const arr=nbaCandidateTeams();
  arr.forEach(x=>x.board=x.fit+rnd(-4,7));
  arr.sort((a,b)=>b.board-a.board);
  return arr[0]||nbaFitForTeam(randTeam("NBA"));
}
function nbaDirectDraftScore(teamFit){
  const ov=overall();
  const rb={"一般":0,"A":8,"S":12,"SS":16,"傳奇":20}[G.talentRarity||"一般"]||0;
  const pot=Math.max(0,(G.potential-70)*.18);
  const fit=clamp((teamFit-48)*.28,-5,11);
  const posBonus=(G.pos==="PG"&&G.attr.pass>=58)?2:0;
  return Math.round(ov+rb+pot+fit+posBonus);
}
function nbaPickFromScore(score){
  if(score<68)return null;
  let lo,hi;
  if(score>=94){lo=1;hi=6;}
  else if(score>=90){lo=3;hi=10;}
  else if(score>=86){lo=6;hi=17;}
  else if(score>=81){lo=15;hi=30;}
  else if(score>=75){lo=28;hi=45;}
  else {lo=42;hi=58;}
  const strength=clamp((score-68)/28,0,1);
  return Math.round(clamp(hi-(hi-lo)*strength+rnd(-2,2),lo,hi));
}
`;
    source=source.replace(/function newGame\(/,teamNeedHelpers+'\nfunction newGame(');

    // 8) 直接挑戰 NBA：真實能力＋球隊需求決定，中選或落選
    source=source.replace(
      /G\.phase="intro"; render\(\); \/\/ 先看開場劇情，再進季前特訓/,
      `if(window.__START_MODE__==="nba"){
        G.age=19;
        G._combine=null;
        G.phase="nbaCombine";
        render();
      }else{
        G.phase="intro"; render();
      }`
    );


    // NBA 落選後的選秀結果頁改成「選擇下一站」
    source=source.replace(
      /const title=G\._draftMode\?"職業選秀 · 選擇下家":"自由市場 · 合約到期";/,
      `const title=G._nbaUndrafted?"NBA 落選 · 選擇下一站":(G._draftMode?"職業選秀 · 選擇下家":"自由市場 · 合約到期");`
    );

    // 9) 正常生涯裡原本的 NBA 選秀，也改成優先配到需求契合球隊
    source=source.replace(
      /team:randTeam\("NBA"\), pick:npick, years:rint\(2,4\),/,
      `team:nbaBestTeamForPlayer().team, pick:npick, years:rint(2,4),`
    );
    source=source.replace(
      /team:randTeam\("NBA"\), pick:npick, years:2,/,
      `team:nbaBestTeamForPlayer().team, pick:npick, years:2,`
    );


    // NBA 落選後選擇其他聯盟並簽約，記錄「落選逆襲」
    source=source.replace(
      /if\(offer\.pick===1\) grantTitle\("firstPick"\);/,
      `if(offer.pick===1) grantTitle("firstPick");
      if(G._nbaUndrafted && offer.league!=="NBA") grantTitle("undraftedHero");`
    );


    // ============================================================
    // 10) 多元傷病系統 + 擴充稱號
    // 傷病使用獨立 RNG，不受「事件骰子固定 6」影響
    // ============================================================

    // 10-1. 擴充稱號 / 標籤
    source=source.replace(
      /const TITLE_DEFS=\{/,
      `const TITLE_DEFS={
        /* --- 傷病類標籤 --- */
        fluBug:{name:"流感病號",good:false,desc:"曾因流感缺陣",effect:"—",buff:{}},
        glassAnkle:{name:"玻璃腳踝",good:false,desc:"腳踝曾出現明顯傷勢",effect:"—",buff:{}},
        hamstringAlert:{name:"腿後肌警報",good:false,desc:"腿後肌傷勢留下紀錄",effect:"—",buff:{}},
        concussionHistory:{name:"腦震盪史",good:false,desc:"曾因腦震盪進入觀察名單",effect:"—",buff:{}},

/* ===== 改造版：多元傷病系統 ===== */
const _baseSeasonInjuryCheck = seasonInjuryCheck;

function _hlPickWeighted(arr){
  const total=arr.reduce((s,x)=>s+(x.w||1),0);
  let r=_rng()*total;
  for(const x of arr){
    r-=x.w||1;
    if(r<=0)return x;
  }
  return arr[arr.length-1];
}

function _hlApplyMods(mods){
  if(!mods)return;
  for(const k in mods){
    if(k in G.attr) G.attr[k]=clamp(G.attr[k]+mods[k],15,99);
  }
}

function _hlRecordInjury(inj,miss,career){
  G.injuryHistory=G.injuryHistory||[];
  G.injuryHistory.push({
    year:G.year,
    age:G.age,
    league:G.league,
    team:G.team,
    key:inj.key,
    name:inj.name,
    severity:inj.major?"major":"minor",
    missGames:miss,
    career:!!career
  });

  if(inj.title)grantTitle(inj.title);

  const hist=G.injuryHistory;
  if(hist.length>=3)grantTitle("injuryProne");
  if(hist.filter(x=>x.severity==="major").length>=2)grantTitle("rehabRegular");
  if(hist.length>=6)grantTitle("hospitalVIP");
}

function _hlSeasonIdentityTags(){

seasonInjuryCheck=function(){

  }

  if(G._memInjury==="season" || G._memInjury==="career"){
    const forced=G._memInjury;
    G._memInjury=null;
    return _hlSpecificInjury(true,forced==="career"&&isPro());
  }

  // 獨立傷病率：骰子固定 6 也不影響
  let p=.22;
  if(G.age>=28)p+=(G.age-27)*.012;
  if(G.health<70)p+=.07;
  if(G.health<50)p+=.10;
  if((G.majorInjuries||0)>=2)p+=.035;
  p=clamp(p,.16,.52);

  if(chance(p)){
    return _hlSpecificInjury(false,false);
  }

  // 健康賽季：恢復一些健康並累積鐵人連續季
  G.health=clamp(G.health+rnd(4,11),0,100);
  G._healthyStreak=(G._healthyStreak||0)+1;
  if(G._healthyStreak>=3)grantTitle("ironBody");

  return null;
};

intlEventForYear=function(y){

function _hlIntlTeamRating(ev){
  const a=G.attr,ov=overall();
  // 中華隊不是只看玩家，但超級球星能顯著提升上限。
  let rt=68;
  rt+=(ov-70)*.42;
  rt+=(a.iq-70)*.055;
  rt+=(a.pass-70)*.035;
  rt+=(a.defense-70)*.025;
  rt+=(G.morale-50)*.025;
  rt+=(G.health-70)*.018;

  if(G.talentRarity==="SS")rt+=1.2;
  if(G.talentRarity==="傳奇")rt+=2.2;
  if(hasTitle&&hasTitle("nationalAce"))rt+=1.2;

  // 台灣隊整體強度每屆仍會有波動。
  rt+=rnd(-3.2,3.2);
  return clamp(rt,55,92);
}

function _hlIntlPlayerLine(ev){
  const a=G.attr,ov=overall(),m=posMult();
  const usage=clamp(.62+(ov-72)*.018,.42,1.22);
  const diff={asia:1.05,asiangames:1.02,wcq:1.12,world:1.28,olympics:1.40}[ev.kind]||1.12;
  const ppg=clamp(((a.shooting*.50+a.three*.31+a.athletic*.19)/diff)*.44*usage*rnd(.88,1.12),2,36);
  const rpg=clamp(((a.rebound*.70+a.athletic*.24)/diff)*.12*m.reb*rnd(.88,1.12),.5,15);
  const apg=clamp(((a.pass*.70+a.iq*.30)/diff)*.098*m.ast*rnd(.88,1.12),.4,13);
  return {ppg:round(ppg),rpg:round(rpg),apg:round(apg)};
}

function _hlIntlKnockout(ev,teamRating){
  const diffMap={
    asia:[66,72,77,81],
    asiangames:[64,70,76,80],
    world:[76,82,88,92],
    olympics:[82,88,93,96]
  };
  const ds=diffMap[ev.kind]||[70,76,82,86];

  // 小組賽：三場中至少贏兩場，或一勝後靠淨勝分晉級。
  let gw=0;
  for(let i=0;i<3;i++){
    const opp=ds[0]+rnd(-4,4);
    const p=clamp(.50+(teamRating-opp)/28+rnd(-.045,.045),.08,.92);
    if(chance(p))gw++;
  }
  const groupAdv = gw>=2 || (gw===1 && chance(clamp(.22+(teamRating-ds[0])*.025,.08,.55)));
  if(!groupAdv)return {place:"小組賽止步",placeNum:12,advanced:false,medal:false,gold:false};

  const qf=chance(clamp(.50+(teamRating-ds[1])/26+rnd(-.05,.05),.07,.93));
  if(!qf)return {place:"八強",placeNum:8,advanced:true,medal:false,gold:false};

  const sf=chance(clamp(.50+(teamRating-ds[2])/25+rnd(-.05,.05),.06,.92));
  if(!sf){
    const bronze=chance(clamp(.50+(teamRating-(ds[2]-1))/25+rnd(-.05,.05),.07,.90));
    return bronze
      ? {place:"🥉 季軍",placeNum:3,advanced:true,medal:true,gold:false}
      : {place:"第 4 名",placeNum:4,advanced:true,medal:false,gold:false};
  }

  const fin=chance(clamp(.50+(teamRating-ds[3])/24+rnd(-.045,.045),.05,.90));
  return fin
    ? {place:"🥇 冠軍",placeNum:1,advanced:true,medal:true,gold:true}
    : {place:"🥈 亞軍",placeNum:2,advanced:true,medal:true,gold:false};
}

simulateIntl=function(ev){

  let result;

  if(ev.kind==="wcq"){

    if(ev.kind==="olympics"){
      // 奧運資格用完，下個週期必須重新取得。

      G.attr.athletic=clamp(G.attr.athletic-rint(1,3),15,99);
      injuryNote="國際賽期間出現較嚴重傷勢，返隊後需要復健。";
      G._recovering=true;
    }else{
      G.health=clamp(G.health-rnd(6,15),15,100);
      injuryNote="國際賽期間受到輕傷與疲勞影響。";
    }
  }else{
    G.health=clamp(G.health-rnd(2,7),0,100);
  }

  // 國家隊王牌 / 傳奇標籤
  if((line.ppg>=18 || line.apg>=7) && overall()>=82)grantTitle("nationalAce");
  if((G.intlMedals||0)>=3 || (ev.kind==="olympics"&&medal))grantTitle("nationalLegend");

  const rec={
    year:G.year,event:ev.name,ppg:line.ppg,rpg:line.rpg,apg:line.apg,
    medal:medal?result.place.replace(/^[^\\s]+\\s/,""):"",
    place:result.place,advanced:result.advanced,mvp,age:G.age,injuryNote,
    teamRating:Math.round(teamRating)
  };
  G.intlHistory.push(rec);
  G.fame=clamp(G.fame+(result.placeNum<=4?ev.prestige*3:result.advanced?ev.prestige:1)+(mvp?5:0),0,100);
  return rec;
};

META[t]||[\"#FF6A2C\",\"#16233d\"];\n        TEAM_COLORS[t]={p:c[0],s:c[1]};\n      });\n    }\n    if(typeof PRO_TEAMS!==\"undefined\"){\n      PRO_TEAMS[\"NBA\"]=all.map(function(t){\n        const c=HL_NBA_TEAM_META[t]||[\"#FF6A2C\",\"#16233d\"];\n        return {n:t,p:c[0],s:c[1]};\n      });\n    }\n  })();\n  const HL_PHASES=[\"nbaPreseason\",\"nbaMidseason\",\"nbaAllStar\",\"nbaSecondHalf\",\"nbaRegularEnd\",\"nbaPlayoffs\"];\n\n  // ===== 進階能力系統：原本 7 項保留給舊系統，相容層上再細分成 21 項 =====\n  function hlDetailedRatings(){\n    if(!G||!G.attr)return {};\n    const a=G.attr;\n    const dm=G.detailMods||{};\n    const pos=G.pos||\"SG\";\n    const h=Number(G.height)||190;\n    const w=Number(G.weight)||85;\n    const health=Number(G.health)||80;\n    const morale=Number(G.morale)||70;\n    const fame=Number(G.fame)||0;\n\n    const guard=(pos===\"PG\"||pos===\"SG\");\n    const wing=(pos===\"SG\"||pos===\"SF\");\n    const big=(pos===\"PF\"||pos===\"C\");\n    const heightEdge=clamp((h-190)*.22,-5,7);\n    const weightEdge=clamp((w-88)*.16,-5,8);\n\n    const r={};\n\n    // 進攻\n    r.finishing=clamp(Math.round(a.shooting*.43+a.athletic*.34+a.iq*.10+heightEdge+(big?3:0)),20,99);\n    r.midrange=clamp(Math.round(a.shooting*.67+a.iq*.17+a.three*.10+(wing?2:0)),20,99);\n    r.threePoint=clamp(Math.round(a.three*.82+a.shooting*.10+a.iq*.08),20,99);\n    r.freeThrow=clamp(Math.round(a.shooting*.54+a.three*.31+a.iq*.15),20,99);\n    r.shotCreation=clamp(Math.round(a.shooting*.43+a.athletic*.22+a.pass*.18+a.iq*.17+(guard?2:0)),20,99);\n\n    // 持球 / 組織\n    r.handle=clamp(Math.round(a.pass*.42+a.athletic*.27+a.iq*.18+a.shooting*.08+(guard?4:big?-3:0)),20,99);\n    r.passing=clamp(Math.round(a.pass*.70+a.iq*.26+(pos===\"PG\"?3:0)),20,99);\n    r.vision=clamp(Math.round(a.pass*.53+a.iq*.43+(pos===\"PG\"?3:0)),20,99);\n\n    // 防守\n    r.perimeterDefense=clamp(Math.round(a.defense*.57+a.athletic*.25+a.iq*.18+(guard||wing?2:0)),20,99);\n    r.interiorDefense=clamp(Math.round(a.defense*.48+a.rebound*.24+a.athletic*.15+a.iq*.08+heightEdge+(big?3:0)),20,99);\n    r.steal=clamp(Math.round(a.defense*.45+a.athletic*.25+a.iq*.25+(guard?2:0)),20,99);\n    r.block=clamp(Math.round(a.defense*.38+a.rebound*.23+a.athletic*.18+a.iq*.08+heightEdge*1.25+(big?5:0)),20,99);\n\n    // 籃板\n    r.offRebound=clamp(Math.round(a.rebound*.62+a.athletic*.21+a.iq*.07+heightEdge+(big?3:0)),20,99);\n    r.defRebound=clamp(Math.round(a.rebound*.66+a.defense*.12+a.athletic*.12+a.iq*.08+heightEdge+(big?2:0)),20,99);\n\n    // 身體\n    r.speed=clamp(Math.round(a.athletic*.76+a.iq*.06+(guard?7:wing?3:big?-5:0)),20,99);\n    r.strength=clamp(Math.round(a.athletic*.48+a.rebound*.12+a.defense*.10+weightEdge+(big?6:guard?-2:0)),20,99);\n    r.vertical=clamp(Math.round(a.athletic*.79+a.rebound*.08+(big?1:guard?2:0)),20,99);\n    r.stamina=clamp(Math.round(a.athletic*.55+a.iq*.18+health*.22),20,99);\n\n    // 心智\n    r.offensiveIQ=clamp(Math.round(a.iq*.52+a.pass*.23+a.shooting*.18+a.three*.07),20,99);\n    r.defensiveIQ=clamp(Math.round(a.iq*.48+a.defense*.38+a.rebound*.09),20,99);\n    r.clutch=clamp(Math.round(a.iq*.32+a.shooting*.27+a.three*.14+morale*.14+fame*.08),20,99);\n\n    // 持久化的細項訓練加成\n    const trainKeys=[\"finishing\",\"midrange\",\"threePoint\",\"freeThrow\",\"shotCreation\",\n      \"handle\",\"passing\",\"vision\",\"perimeterDefense\",\"interiorDefense\",\"steal\",\"block\",\n      \"offRebound\",\"defRebound\",\"speed\",\"strength\",\"vertical\",\"stamina\",\n      \"offensiveIQ\",\"defensiveIQ\",\"clutch\"];\n    trainKeys.forEach(function(k){\n      r[k]=clamp(Math.round((r[k]||20)+(dm[k]||0)),20,99);\n    });\n\n    // 技術挑戰賽用複合能力（要在細項訓練加成後再算）\n    r.catchShoot=clamp(Math.round(r.threePoint*.55+r.offensiveIQ*.25+r.freeThrow*.10+r.stamina*.10),20,99);\n    r.pullUp=clamp(Math.round(r.midrange*.35+r.threePoint*.25+r.handle*.22+r.shotCreation*.18),20,99);\n\n    return r;\n  }\n  window.hlDetailedRatings=hlDetailedRatings;\n\n  function hlDetailGroupHTML(title,items,r){\n    return '<div style=\"margin-top:9px\"><div class=\"label\" style=\"margin-bottom:5px\">'+title+'</div>'\n      +'<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:5px 10px\">'\n      +items.map(function(x){\n        const v=r[x[0]]||0;\n        const col=v>=90?'var(--gold)':v>=80?'var(--green)':v>=70?'var(--blue)':'var(--ink)';\n        return '<div style=\"display:flex;justify-content:space-between;gap:8px;padding:5px 7px;background:#0d1626;border:1px solid var(--line);border-radius:8px;font-size:11px\">'\n          +'<span style=\"color:var(--dim)\">'+x[1]+'</span><b style=\"font-family:Oswald;color:'+col+'\">'+v+'</b></div>';\n      }).join('')+'</div></div>';\n  }\n\n  function hlDetailedPanelHTML(){\n    const r=hlDetailedRatings();\n    if(!Object.keys(r).length)return '';\n    return '<details id=\"hl-detail-ratings\" style=\"margin-top:9px;border-top:1px solid var(--line);padding-top:8px\">'\n      +'<summary style=\"cursor:pointer;font-size:12px;font-weight:900;color:var(--gold)\">📊 詳細能力（21 項）</summary>'\n      +hlDetailGroupHTML(\"進攻\",[\n        [\"finishing\",\"籃下終結\"],[\"midrange\",\"中距離\"],[\"threePoint\",\"三分投射\"],\n        [\"freeThrow\",\"罰球\"],[\"shotCreation\",\"自主創造\"]\n      ],r)\n      +hlDetailGroupHTML(\"持球 / 組織\",[\n        [\"handle\",\"運球\"],[\"passing\",\"傳球\"],[\"vision\",\"球場視野\"]\n      ],r)\n      +hlDetailGroupHTML(\"防守\",[\n        [\"perimeterDefense\",\"外線防守\"],[\"interiorDefense\",\"內線防守\"],\n        [\"steal\",\"抄截\"],[\"block\",\"阻攻\"]\n      ],r)\n      +hlDetailGroupHTML(\"籃板\",[\n        [\"offRebound\",\"進攻籃板\"],[\"defRebound\",\"防守籃板\"]\n      ],r)\n      +hlDetailGroupHTML(\"身體\",[\n        [\"speed\",\"速度\"],[\"strength\",\"力量\"],[\"vertical\",\"彈跳\"],[\"stamina\",\"耐力\"]\n      ],r)\n      +hlDetailGroupHTML(\"球商 / 關鍵能力\",[\n        [\"offensiveIQ\",\"進攻球商\"],[\"defensiveIQ\",\"防守球商\"],[\"clutch\",\"關鍵球\"]\n      ],r)\n      +'</details>';\n  }\n\n\n  // ===== 21 項細分訓練系統 =====\n  const HL_DETAIL_LABE iveIQ:{iq:.54,defense:.34,rebound:.12},\n    clutch:{iq:.38,shooting:.28,three:.16,pass:.10,athletic:.08}\n  };\n\n  function hlDetailCost(v){\n    // V9.2：21 項能力較多，成本改成更平滑\n    // 79 以下：1點；80~87：2點；88~93：3點；94+：4點\n    // 超過原始潛力後只額外 +2，不再直接翻倍\n    let c=v<80?1:v<88?2:v<94?3:4;\n    if(v>=G.potential)c+=2;\n    return c;\n  }\n\n  function hlDetailCap(){\n    return Math.min(99,(G.potential||80)+4);\n  }\n\n  function hlEnsureDetailAlloc(){\n    if(!G._alloc)return null;\n    if(G._detailAlloc)return G._detailAlloc;\n\n    const base=hlDetailedRatings();\n    const add={};\n    Object.keys(HL_DETAIL_LABELS).forEach(function(k){add[k]=0;});\n\n    G._detailAlloc={\n      base:base,\n      add:add,\n      sp:G._alloc.sp,\n      spLeft:G._alloc.spLeft,\n      bonus:G._alloc.bonus||0\n    };\n    return G._detailAlloc;\n  }\n\n  function hlDetailCurrent(k){\n    const A=hlEnsureDetailAlloc();\n    return Math.min(99,(A.base[k]||20)+(A.add[k]||0));\n  }\n\n  function hlDetailTrainingRow(k){\n    const A=hlEnsureDetailAlloc();\n    const v=hlDetailCurrent(k);\n    const c=hlDetailCost(v);\n    const added=A.add[k]||0;\n    const canPlus=v<hlDetailCap()&&A.spLeft>=c;\n    const canMinus=added>0;\n\n    return '<div style=\"display:grid;grid-template-columns:74px 1fr 40px 66px;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05)\">'\n      +'<div style=\"font-size:11px;color:var(--dim)\">'+HL_DETAIL_LABELS[k]+'</div>'\n      +'<div><div style=\"height:6px;background:#0c1526;border-radius:999px;overflow:hidden\"><i style=\"display:block;height:100%;width:'+v+'%;background:linear-gradient(90deg,var(--orange2),var(--orange));border-radius:999px\"></i></div></div>'\n      +'<div style=\"font-family:Oswald;font-weight:800;text-align:center\">'+v+(added?'<span style=\"font-size:9px;color:var(--green)\"> +'+added+'</span>':'')+'</div>'\n      +'<div style=\"display:flex;gap:4px\"><button class=\"stp\" data-hld-minus=\"'+k+'\" '+(canMinus?'':'disab     const ultimateCareerV9="<script>\n(function(){\n\"use strict\";\n/* =========================================================================\n   HARDWOOD LIFE · ULTIMATE CAREER V9\n   - 30 隊完整球員名單 / 隊友與對手\n   - 聯盟中心 / 交易動態\n   - MVP / DPOY / ROTY / 得分王等即時榜\n   - 逐場季後賽\n   - 合約、延長合約、RFA/UFA、頂薪\n   - 退休 → 樂透 → 選秀 → FA/交易 → 合約 → 夏聯 → 訓練營\n   - 歷史紀錄 / 生涯里程碑\n   ========================================================================= */\n\nconst V9_EAST=[\n  \"波士頓翡翠\",\"布魯克林夜鷹\",\"紐約帝國\",\"費城自由鐘\",\"多倫多北極\",\n  \"克里夫蘭騎影\",\"芝加哥疾風\",\"底特律引擎\",\"印第安納疾走\",\"密爾瓦基雄角\",\n  \"亞特蘭大翔鷹\",\"夏洛特蜂巢\",\"邁阿密浪潮\",\"奧蘭多魔域\",\"華盛頓國會\"\n];\nconst V9_WEST=[\n  \"丹佛高原\",\"明尼蘇達雪狼\",\"奧克拉荷馬雷暴\",\"波特蘭伐木\",\"猶他高峰\",\n  \"灣區金橋\",\"洛城快航\",\"洛城星辰\",\"鳳凰城烈日\",\"沙加緬度河王\",\n  \"達拉斯野馬\",\"休士頓升空\",\"孟菲斯藍調\",\"紐奧良鵜影\",\"聖安東尼奧鐵騎\"\n];\nconst V9_TEAMS=V9_EAST.concat(V9_WEST);\nconst V9_POS=[\"PG\",\"SG\",\"SF\",\"PF\",\"C\"];\n\nconst V9_FIRST=[\n \"杰倫\",\"馬可\",\"德文\",\"艾登\",\"泰瑞斯\",\"凱登\",\"布蘭登\",\"卡麥隆\",\"傑森\",\"安東尼\",\n \"馬利克\",\"達里厄斯\",\"喬丹\",\"以賽亞\",\"德瑞克\",\"諾亞\",\"伊萊\",\"盧卡\",\"尼古拉\",\"米洛\",\n \"海登\",\"科爾\",\"賈邁爾\",\"德安德烈\",\"特雷\",\"羅尼\",\"凱文\",\"奧斯汀\",\"朱利安\",\"馬庫斯\",\n \"尚恩\",\"戴蒙\",\"雷蒙\",\"基恩\",\"泰勒\",\"阿隆\",\"傑瑞米\",\"柯林\",\"亞歷克斯\",\"泰迪\"\n];\nconst V9_LAST=[\n \"柯爾\",\"哈德森\",\"布魯克斯\",\"卡特\",\"華勒斯\",\"米勒\",\"史東\",\"戴維斯\",\"強森\",\"威廉斯\",\n \"羅賓森\",\"湯普森\",\"格林\",\"沃克\",\"楊\",\"希爾\",\"摩爾\",\"克拉克\",\"路易斯\",\"霍爾\",\n \"馬丁\",\"艾倫\",\"金\",\"萊特\",\"史考特\",\"貝克\",\"亞當斯\",\"尼爾森\",\"米契爾\",\"坎貝爾\",\n \"羅培茲\",\"安德森\",\"帕克\",\"特納\",\"庫克\",\"墨菲\",\"柯林斯\",\"里德\",\"鮑威爾\",\"沃德\"\n];\n\nfunction v9Hash(str){\n  let h=2166136261;\n  str=String(str||\"\");\n  for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}\n  return Math.abs(h>>>0);\n}\nfunction v9Rand(seed,min=0,max=1){\n  const x=(Math.sin(seed*12.9898+78.233)*43758.5453)%1;\n  const u=Math.abs(x);\n  return min+u*(max-min);\n}\nfunction v9Int(seed,min,max){return Math.floor(v9Rand(seed,min,max+1));}\nfunction v9Clamp(v,a,b){return Math.max(a,Math.min(b,v));}\nfunction v9Pick(arr,seed){return arr[Math.abs(seed)%arr.length];}\nfunction v9Shuffle(arr,seed){\n  const a=arr.slice();\n  for(let i=a.length-1;i>0;i--){\n    const j=v9Int(seed+i*97,0,i);\n    [a[i],a[j]]=[a[j],a[i]];\n  }\n  return a;\n}\nfunction v9Conf(team){return V9_EAST.includes(team)?\"東區\":\"西區\";}\nfunction v9Money(v){try{return fmtMoney(v);}catch(e){return Math.round(v||0)+\"萬\";}}\nfunction v9Esc(s){\n  return String(s??\"\").replace(/[&<>\"']/g,m=>({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[m]));\n}\nfunction v9RoleByIndex(i){\n  return [\"王牌\",\"二當家\",\"先發\",\"先發\",\"先發\",\"第六人\",\"主要輪替\",\"輪替\",\"板凳\",\"板凳\"][i]||\"板凳\";\n}\nfunction v9CpuStats(p,year){\n  const seed=v9Hash(p.id+\"|stats|\"+year);\n  const pos=p.pos;\n  const usage=v9Clamp((p.ovr-65)/30,.25,1);\n  const ppg=v9Clamp((p.ovr-55)*.72*usage+v9Rand(seed,-2.5,3.5),2,34);\n  const rbase=(pos===\"C\"?8.5:pos===\"PF\"?7:pos===\"SF\"?5:pos===\"SG\"?3.7:3.2);\n  const abase=(pos===\"PG\"?7.2:pos===\"SG\"?4.1:pos===\"SF\"?3.7:pos===\"PF\"?2.8:2.2);\n  const rpg=v9Clamp(rbase+(p.ovr-75)*.10+v9Rand(seed+1,-1.2,1.2),1,14);\n  const apg=v9Clamp(abase+(p.ovr-75)*.09+v9Rand(seed+2,-1.0,1.2),.5,12);\n  const spg=v9Clamp(.6+(p.ovr-70)*.018+v9Rand(seed+3,-.2,.4),.2,2.4);\n  const bbase=(pos===\"C\"?1.4:pos===\"PF\"?1.0:pos===\"SF\"?.6:.3);\n  const bpg=v9Clamp(bbase+(p.ovr-75)*.015+v9Rand(seed+4,-.2,.35),.1,2.8);\n  return {ppg:+ppg.toFixed(1),rpg:+rpg.toFixed(1),apg:+apg.toFixed(1),spg:+spg.toFixed(1),bpg:+bpg.toFixed(1)};\n}\n\nfunction v9GeneratePlayer(team,index,year){\n  const seed=v9Hash(team+\"|\"+index+\"|\"+year+\"|v9\");\n  const tier=[92,87,82,80,78,76,74,72,70,68][index]||68;\n  const ovr=v9Clamp(Math.round(tier+v9Rand(seed,-4.5,4.5)),64,97);\n  const age=v9Int(seed+11,index<3?22:19,index<3?34:35);\n  const pot=v9Clamp(Math.round(ovr+v9Rand(seed+12,2,12)-(age>29?5:0)),ovr,99);\n  const pos=V9_POS[(index+v9Int(seed+13,0,2))%5];\n  const salary=Math.round(v9Clamp((ovr-60)*(ovr-60)*9+350+v9Rand(seed+14,-250,600),120,85000));\n  const years=v9Int(seed+15,1,5);\n  const id=\"v9_\"+v9Hash(team+\"|\"+index+\"|\"+year);\n  const name=v9Pick(V9_FIRST,seed+21)+\"・\"+v9Pick(V9_LAST,seed+22);\n  return {\n    id,name,pos,age,ovr,potential:pot,team,\n    salary,years,role:v9RoleByIndex(index),\n    rookie:age<=22&&index>=6,\n    careerPts:Math.max(0,Math.round((age-19)*82*v9Clamp((ovr-56)*.48,3,24))),\n    seasonStats:{}\n  };\n}\n\nfunction v9EnsureWorld(){\n  if(!G)return null;\n  if(!G._v9World){\n    const rosters={};\n    V9_TEAMS.forEach(team=>{\n      rosters[team]=Array.from({length:10},(_,i)=>v9GeneratePlayer(team,i,G.year));\n    });\n    G._v9World={\n      createdYear:G.year,\n      rosters,\n      transactions:[],\n      retired:[],\n      draftHistory:[],\n      champions:[],\n      version:9\n    };\n  }\n  V9_TEAMS.forEach(team=>{\n    if(!Array.isArray(G._v9World.rosters[team])){\n      G._v9World.rosters[team]=Array.from({length:10},(_,i)=>v9GeneratePlayer(team,i,G.year));\n    }\n  });\n  G._v9Records=G._v9Records||{\n    singleGamePts:{value:73,name:\"艾利克斯・沃克\",year:2024},\n    seasonPPG:{value:36.2,name:\"達蒙・卡特\",year:2023},\n    seasonAPG:{value:12.4,name:\"雷蒙・米勒\",year:2022},\n    seasonRPG:{value:16.1,name:\"尼古拉・史東\",year:2025},\n    careerPts:[]\n  };\n  G._v9AwardLadders=G._v9AwardLadders||{};\n  G._v9Milestones=G._v9Milestones||[];\n  v9SyncUser();\n  return G._v9World;\n}\n\nfunction v9SyncUser(){\n  if(!G||!G._v9World||G.league!==\"NBA\")return;\n  G._v9UserTeam=G.team;\n}\n\nfunction v9UserCard(){\n  if(!G)return null;\n  const c=G.contract||{};\n  return {\n    id:\"USER\",name:G.name+\"（你）\",pos:G.pos,age:G.age,ovr:overall(),\n    potential:G.potential,team:G.team,salary:c.salary||0,\n    years:c.yearsLeft??c.years??0,role:G.role||\"球員\",isUser:true,\n    rookie:!!c.rookie\n  };\n}\n\nfunction v9Roster(team){\n  v9EnsureWorld();\n  const arr=(G._v9World.rosters[team]||[]).slice();\n  if(G.league===\"NBA\"&&G.team===team)arr.push(v9UserCard());\n  return arr.sort((a,b)=>b.ovr-a.ovr);\n}\n\nfunction v9TeamPower(team){\n  const r=v9Roster(team);\n  const top=r.slice(0,8);\n  if(!top.length)return 72;\n  let p=top.reduce((s,x,i)=>s+x.ovr*(i<2?1.3:i<5?1:.7),0)/\n        top.reduce((s,x,i)=>s+(i<2?1.3:i<5?1:.7),0);\n  return v9Clamp(p,65,98);\n}\nfunction v9ProjectedWinPct(team){\n  const p=v9TeamPower(team);\n  return v9Clamp(.50+(p-80)*.018,.20,.80);\n}\nfunction v9TeamDirection(team){\n  const pct=v9ProjectedWinPct(team);\n  if(pct>=.62)return {key:\"contender\",text:\"爭冠球隊\",short:\"爭冠\",color:\"var(--gold)\"};\n  if(pct>=.54)return {key:\"playoff\",text:\"季後賽球隊\",short:\"季後賽\",color:\"var(--green)\"};\n  if(pct>=.46)return {key:\"middle\",text:\"中游球隊\",short:\"中游\",color:\"#9bb2d1\"};\n  if(pct>=.38)return {key:\"rebuild\",text:\"重建球隊\",short:\"重建\",color:\"#67c5ff\"};\n  return {key:\"tank\",text:\"擺爛球隊\",short:\"擺爛\",color:\"#ff7a7a\"};\n}\nfunction v9TeamDirectionBadge(team){\n  const d=v9TeamDirection(team);\n  return '<span style=\"display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;border:1px solid '+d.color+';color:'+d.color+';font-size:10px;font-weight:900\">'+d.short+'</span>';\n}\nfunction v9RolePromiseForTeam(team,ov){\n  const d=v9TeamDirection(team);\n  ov=Number(ov||overall());\n\n  if(d.key===\"contender\"){\n    if(ov>=94)return \"爭冠核心\";\n    if(ov>=89)return \"先發競爭\";\n    if(ov>=84)return \"第六人 / 關鍵輪替\";\n    return \"輪替競爭\";\n  }\n  if(d.key===\"playoff\"){\n    if(ov>=91)return \"球隊核心\";\n    if(ov>=85)return \"先發\";\n    if(ov>=80)return \"第六人\";\n    return \"主要輪替\";\n  }\n  if(d.key===\"middle\"){\n    if(ov>=88)return \"球隊核心\";\n    if(ov>=82)return \"先發\";\n    if(ov>=77)return \"主要輪替\";\n    return \"輪替培養\";\n  }\n  if(d.key===\"rebuild\"){\n    if(ov>=85)return \"建隊核心\";\n    if(ov>=78)return \"先發培養\";\n    if(ov>=73)return \"主要輪替培養\";\n    return \"長期培養\";\n  }\n  if(ov>=82)return \"高球權建隊核心\";\n  if(ov>=75)return \"先發 + 高球權\";\n  if(ov>=70)return \"重點培養\";\n  return \"長期養成\";\n}\nfunction v9TeamOpportunity(team,ov){\n  const d=v9TeamDirection(team);\n  const promise=v9RolePromiseForTeam(team,ov);\n  ov=Number(ov||overall());\n  let minutes=24,usage=1,stat=1;\n\n  if(d.key===\"contender\"){\n    if(ov>=94){minutes=35;usage=1.08;stat=1.04;}\n    else if(ov>=89){minutes=31;usage=.97;stat=1.00;}\n    else if(ov>=84){minutes=27;usage=.90;stat=.98;}\n    else {minutes=20;usage=.82;stat=.95;}\n  }else if(d.key===\"playoff\"){\n    if(ov>=91){minutes=35;usage=1.06;stat=1.03;}\n    else if(ov>=85){minutes=32;usage=1.00;stat=1.01;}\n    else if(ov>=80){minutes=27;usage=.94;stat=.99;}\n    else {minutes=22;usage=.88;stat=.97;}\n  }else if(d.key===\"middle\"){\n    if(ov>=88){minutes=35;usage=1.09;stat=1.04;}\n    else if(ov>=82){minutes=32;usage=1.03;stat=1.02;}\n    else {minutes=26;usage=.96;stat=1.00;}\n  }else if(d.key===\"rebuild\"){\n    if(ov>=85){minutes=37;usage=1.16;stat=1.06;}\n    else if(ov>=78){minutes=34;usage=1.11;stat=1.04;}\n    else {minutes=29;usage=1.04;stat=1.02;}\n  }else{\n    if(ov>=82){minutes=38;usage=1.22;stat=1.08;}\n    else if(ov>=75){minutes=35;usage=1.16;stat=1.06;}\n    else {minutes=31;usage=1.08;stat=1.03;}\n  }\n  return {direction:d,promise,minutes,usage,stat};\n}\nwindow.v9TeamPower=v9TeamPower;\nwindow.v9ProjectedWinPct=v9ProjectedWinPct;\nwindow.v9TeamDirection=v9TeamDirection;\nwindow.v9RolePromiseForTeam=v9RolePromiseForTeam;\nwindow.v9TeamOpportunity=v9TeamOpportunity;\n\nfunction v9PlayerRow(p){\n  const contract=p.isUser\n    ? ((G.contract&&G.contract.contractLabel)||((p.years||0)+\" 年合約\"))\n    : ((p.rookie?\"新秀\":\"\")+(p.years||0)+\" 年\");\n  return '<div style=\"display:grid;grid-template-columns:34px 1fr 42px 46px;gap:7px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)\">'\n    +'<div style=\"font-family:Oswald;font-weight:900;color:'+(p.ovr>=90?'var(--gold)':p.ovr>=82?'var(--green)':'var(--ink)')+'\">'+p.ovr+'</div>'\n    +'<div><div style=\"font-weight:800;font-size:12px\">'+v9Esc(p.name)+'</div>'\n    +'<div class=\"small\">'+p.pos+'｜'+p.age+'歲｜'+v9Esc(p.role||\"輪替\")+'</div>'\n    +'<div style=\"font-size:9.5px;color:var(--faint)\">'+v9Esc(contract)+'｜'+v9Money(p.salary||0)+'/年</div></div>'\n    +'<div style=\"font-size:10px;text-align:center;color:var(--dim)\">POT<br><b>'+p.potential+'</b></div>'\n    +'<div style=\"font-size:10px;text-align:right;color:var(--dim)\">'+(p.isUser?'YOU':p.rookie?'R':'NBA')+'</div></div>';\n}\n\nfunction v9TeamRosterHTML(team){\n  const roster=v9Roster(team);\n  const userSame=G&&G.team===team;\n  let comp=\"\";\n  if(userSame){\n    const rivals=roster.filter(p=>!p.isUser&&p.pos===G.pos).sort((a,b)=>b.ovr-a.ovr);\n    if(rivals.length){\n      comp='<div class=\"small\" style=\"margin-top:8px;color:var(--gold)\">同位置競爭：'\n        +rivals.slice(0,2).map(x=>v9Esc(x.name)+' OVR '+x.ovr).join('、')+'</div>';\n    }\n  }\n  return '<div class=\"panel\"><div class=\"label\">'+v9Conf(team)+' · TEAM ROSTER</div>'\n    +'<h2 style=\"margin:6px 0\">'+v9Esc(team)+'</h2>'\n    +'<div class=\"small\">球隊戰力 '+v9TeamPower(team).toFixed(1)+'｜完整輪換 '+roster.length+' 人</div>'\n    +comp+'<div style=\"margin-top:7px\">'+roster.map(v9PlayerRow).join('')+'</div></div>';\n}\n\n/* ----------------------- 聯盟獎項榜 ----------------------- */\nfunction v9UserSeasonStats(kind){\n  const F=G&&G._nbaSeasonFlow;\n  if(!F)return null;\n  if(kind===\"mid\"&&F.half)return {...F.half,spg:1.0,bpg:.5};\n  if(F.regular)return {\n    ppg:F.regular.ppg||0,rpg:F.regular.rpg||0,apg:F.regular.apg||0,\n    spg:F.regular.spg||0,bpg:F.regular.bpg||0\n  };\n  return F.half?{...F.half,spg:1,bpg:.5}:null;\n}\n\nfunction v9AwardCandidates(kind=\"mid\"){\n  v9EnsureWorld();\n  const all=[];\n  V9_TEAMS.forEach(team=>{\n    const roster=v9Roster(team).filter(x=>!x.isUser);\n    roster.slice(0,4).forEach(p=>{\n      const st=v9CpuStats(p,G.year);\n      all.push({...p,...st});\n    });\n  });\n  const us=v9UserSeasonStats(kind);\n  if(us&&G.league===\"NBA\"){\n    all.push({\n      id:\"USER\",name:G.name+\"（你）\",team:G.team,pos:G.pos,age:G.age,\n      ovr:overall(),rookie:!!(G.contract&&G.contract.rookie),...us,isUser:true\n    });\n  }\n  return all;\n}\nfunction v9BuildLadders(kind=\"mid\"){\n  const c=v9AwardCandidates(kind);\n  const score={\n    MVP:p=>p.ppg*1.45+p.apg*.85+p.rpg*.62+(p.ovr-75)*.55+(p.team===G.team?1:0),\n    DPOY:p=>p.spg*8+p.bpg*9+p.rpg*.34+(p.ovr-75)*.26+([\"PF\",\"C\"].includes(p.pos)?1:0),\n    ROTY:p=>(p.rookie||p.age<=22)?p.ppg*1.25+p.apg*.7+p.rpg*.55+(p.ovr-70)*.45:-999,\n    得分王:p=>p.ppg,\n    助攻王:p=>p.apg,\n    籃板王:p=>p.rpg\n  };\n  const out={};\n  Object.keys(score).forEach(k=>{\n    out[k]=c.map(p=>({...p,_score:score[k](p)}))\n      .filter(p=>p._score>-500)\n      .sort((a,b)=>b._score-a._score).slice(0,5);\n  });\n  G._v9AwardLadders[G.year+\"_\"+kind]=out;\n  return out;\n}\nfunction v9LadderHTML(kind=\"mid\"){\n  const L=G._v9AwardLadders[G.year+\"_\"+kind]||v9BuildLadders(kind);\n  const title=(kind===\"mid\"?\"季中獎項競爭\":\"季末獎項競爭\");\n  return '<details class=\"panel\" id=\"v9-awards-ladder\" style=\"padding:0;overflow:hidden\">'\n    +'<summary style=\"cursor:pointer;list-style:none;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px\">'\n      +'<div><div class=\"label\">NBA AWARD LADDER</div><h3 style=\"margin:5px 0 0\">'+title+'</h3></div>'\n      +'<span style=\"flex:0 0 auto;color:var(--gold);font-size:11px;font-weight:900\">點擊展開 ▼</span>'\n    +'</summary>'\n    +'<div style=\"padding:0 12px 12px;border-top:1px solid var(--line)\">'\n    +[\"MVP\",\"DPOY\",\"ROTY\",\"得分王\",\"助攻王\",\"籃板王\"].map(k=>{\n      const rows=L[k]||[];\n      return '<details style=\"margin:8px 0\"><summary style=\"font-weight:900;font-size:12px;color:var(--gold)\">'+k+'</summary>'\n        +rows.map((p,i)=>'<div style=\"display:grid;grid-template-columns:22px 1fr auto;gap:6px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:11px;'\n          +(p.isUser?'color:var(--green);font-weight:900':'')+'\"><b>#'+(i+1)+'</b><span>'+v9Esc(p.name)+'｜'+v9Esc(p.team)+'</span>'\n          +'<span>'+((k===\"得分王\")?p.ppg.toFixed(1):(k===\"助攻王\")?p.apg.toFixed(1):(k===\"籃板王\")?p.rpg.toFixed(1):p._score.toFixed(1))+'</span></div>').join('')\n        +'</details>';\n    }).join('')\n    +'</div></details>';\n}\n\n/* ----------------------- 歷史紀錄 ----------------------- */\nfunction v9UpdateUserRecords(season){\n  if(!G||!season)return;\n  v9EnsureWorld();\n  const R=G._v9Records;\n  if((season.ppg||0)>R.seasonPPG.value)R.seasonPPG={value:+season.ppg.toFixed(1),name:G.name,year:G.year};\n  if((season.apg||0)>R.seasonAPG.value)R.seasonAPG={value:+season.apg.toFixed(1),name:G.name,year:G.year};\n  if((season.rpg||0)>R.seasonRPG.value)R.seasonRPG={value:+season.rpg.toFixed(1),name:G.name,year:G.year};\n  const games=season.gp||season.games||82;\n  const pts=Math.round((season.ppg||0)*games);\n  G._v9CareerPts=(G._v9CareerPts||0)+pts;\n  const marks=[1000,5000,10000,15000,20000,25000,30000,35000,40000];\n  marks.forEach(m=>{\n    if(G._v9CareerPts>=m&&!G._v9Milestones.includes(m)){\n      G._v9Milestones.push(m);\n      try{logAward(\"NBA\",\"生涯 \"+m.toLocaleString()+\" 分\",G.year);}catch(e){}\n    }\n  });\n}\nfunction v9RecordGame(line){\n  if(!line||!G)return;\n  v9EnsureWorld();\n  if(line.pts>G._v9Records.singleGamePts.value){\n    G._v9Records.singleGamePts={value:line.pts,name:G.name,year:G.year};\n  }\n}\nfunction v9RecordsHTML(){\n  v9EnsureWorld();\n  const R=G._v9Records;\n  const seasons=(G.seasonHistory||[]).filter(s=>s.league===\"NBA\");\n  const careerPts=G._v9CareerPts||Math.round(seasons.reduce((x,s)=>x+(s.ppg||0)*(s.gp||82),0));\n  const careerGames=seasons.reduce((x,s)=>x+(s.gp||82),0);\n  const cpu=[];\n  V9_TEAMS.forEach(t=>(G._v9World.rosters[t]||[]).slice(0,2).forEach(p=>cpu.push({name:p.name,value:p.careerPts||0})));\n  cpu.push({name:G.name+\"（你）\",value:careerPts,isUser:true});\n  cpu.sort((a,b)=>b.value-a.value);\n  const rank=cpu.findIndex(x=>x.isUser)+1;\n  return '<div class=\"panel\"><div class=\"label\">NBA HISTORY BOOK</div><h2 style=\"margin:6px 0\">📚 歷史紀錄</h2>'\n    +'<div class=\"statline\"><div class=\"s\"><div class=\"v\">'+careerPts.toLocaleString()+'</div><div class=\"l\">生涯得分</div></div>'\n    +'<div class=\"s\"><div class=\"v\">'+careerGames+'</div><div class=\"l\">NBA 場次</div></div>'\n    +'<div class=\"s\"><div class=\"v\">#'+rank+'</div><div class=\"l\">模擬得分榜</div></div>'\n    +'<div class=\"s\"><div class=\"v\">'+(G.careerAwards&&G.careerAwards[\"冠軍\"]||0)+'</div><div class=\"l\">冠軍</div></div></div>'\n    +[\n      [\"單場得分\",R.singleGamePts.value,R.singleGamePts.name,R.singleGamePts.year],\n      [\"單季得分王紀錄\",R.seasonPPG.value,R.seasonPPG.name,R.seasonPPG.year],\n      [\"單季助攻紀錄\",R.seasonAPG.value,R.seasonAPG.name,R.seasonAPG.year],\n      [\"單季籃板紀錄\",R.seasonRPG.value,R.seasonRPG.name,R.seasonRPG.year]\n    ].map(x=>'<div style=\"display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)\">'\n      +'<div><b>'+x[0]+'</b><div class=\"small\">'+v9Esc(x[2])+'｜'+x[3]+'</div></div>'\n      +'<b style=\"font-family:Oswald;color:var(--gold);font-size:20px\">'+x[1]+'</b></div>').join('')\n    +'<div class=\"label\" style=\"margin-top:12px\">生涯總得分 TOP 10</div>'\n    +cpu.slice(0,10).map((x,i)=>'<div class=\"small\" style=\"display:flex;justify-content:space-between;padding:5px 0;'\n      +(x.isUser?'color:var(--green);font-weight:900':'')+'\"><span>#'+(i+1)+' '+v9Esc(x.name)+'</span><b>'+x.value.toLocaleString()+'</b></div>').join('')\n    +'</div>';\n}\n\n/* ----------------------- 聯盟中心 ----------------------- */\nfunction v9TransactionsHTML(){\n  v9EnsureWorld();\n  const tx=(G._v9World.transactions||[]).slice(-30).reverse();\n  return '<div class=\"panel\"><div class=\"label\">TRANSACTION WIRE</div><h2 style=\"margin:6px 0\">📰 聯盟動態</h2>'\n    +(tx.length?tx.map(x=>'<div style=\"padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12px\">'\n      +'<b>'+x.year+'</b>｜'+v9Esc(x.text)+'</div>').join(''):'<div class=\"muted\">目前沒有重大異動。</div>')+'</div>';\n}\nfunction v9HubTabs(){\n  const tab=G._v9HubTab||\"team\";\n  const tabs=[[\"team\",\"我的球隊\"],[\"league\",\"30 隊\"],[\"awards\",\"獎項榜\"],[\"records\",\"紀錄\"],[\"news\",\"交易動態\"]];\n  return '<div style=\"display:flex;gap:6px;overflow-x:auto;margin-bottom:8px\">'\n    +tabs.map(t=>'<button class=\"chip '+(tab===t[0]?'on':'')+'\" onclick=\"window.__v9SetTab(\\''+t[0]+'\\')\">'+t[1]+'</button>').join('')+'</div>';\n}\nfunction v9AllTeamsHTML(){\n  const selected=G._v9SelectedTeam||G.team||V9_TEAMS[0];\n  return '<div class=\"panel\"><div class=\"label\">NBA 30 TEAMS</div>'\n    +'<select onchange=\"window.__v9SelectTeam(this.value)\" style=\"width:100%;margin-top:8px;background:#0d1626;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px\">'\n    +V9_TEAMS.map(t=>'<option value=\"'+v9Esc(t)+'\" '+(t===selected?'selected':'')+'>'+v9Conf(t)+'｜'+v9Esc(t)+'</option>').join('')\n    +'</select></div>'+v9TeamRosterHTML(selected);\n}\nfunction v9RenderHub(){\n  v9EnsureWorld();\n  const tab=G._v9HubTab||\"team\";\n  let body=\"\";\n  if(tab===\"team\")body=v9TeamRosterHTML(G.team);\n  else if(tab===\"league\")body=v9AllTeamsHTML();\n  else if(tab===\"awards\")body=v9LadderHTML(G._nbaSeasonFlow&&G._nbaSeasonFlow.regular?\"final\":\"mid\");\n  else if(tab===\"records\")body=v9RecordsHTML();\n  else body=v9TransactionsHTML();\n  app.innerHTML=hudHTML()+'<div class=\"wrap\"><div class=\"panel\" style=\"border-color:var(--gold)\">'\n    +'<div class=\"label\">LEAGUE CENTER · ULTIMATE V9</div><h2 style=\"margin:6px 0\">🏀 NBA 聯盟中心</h2>'\n    +'<div class=\"small\">30 隊球員名單、獎項競爭、交易市場與歷史紀錄會隨生涯持續變化。</div></div>'\n    +v9HubTabs()+body+'<button class=\"btn ghost\" onclick=\"window.__v9CloseHub()\">返回生涯</button></div>';\n  window.scrollTo(0,0);\n}\nwindow.__v9OpenHub=function(){\n  if(!G||G.league!==\"NBA\"||G.retired)return;\n  G._v9HubReturn=G.phase;\n  G.phase=\"v9LeagueHub\";\n  render();\n};\nwindow.__v9CloseHub=function(){G.phase=G._v9HubReturn||\"training\";render();};\nwindow.__v9SetTab=function(t){G._v9HubTab=t;render();};\nwindow.__v9SelectTeam=function(t){G._v9SelectedTeam=t;render();};\n\n/* ----------------------- 逐場季後賽 ----------------------- */\nfunction v9StandingRow(team){\n  const F=G._nbaSeasonFlow;\n  if(!F||!F.finalStandings)return null;\n  return (F.finalStandings.east||[]).concat(F.finalStandings.west||[]).find(x=>x.team===team)||null;\n}\nfunction v9Seed(team){\n  const r=v9StandingRow(team);return r?r.seed:99;\n}\nfunction v9AiWinner(a,b){\n  const pa=v9TeamPower(a),pb=v9TeamPower(b);\n  return chance(v9Clamp(.5+(pa-pb)/32,.20,.80))?a:b;\n}\nfunction v9OtherChampion(rows){\n  const w18=v9AiWinner(rows[0].team,rows[7].team);\n  const w45=v9AiWinner(rows[3].team,rows[4].team);\n  const w27=v9AiWinner(rows[1].team,rows[6].team);\n  const w36=v9AiWinner(rows[2].team,rows[5].team);\n  return v9AiWinner(v9AiWinner(w18,w45),v9AiWinner(w27,w36));\n}\nfunction v9SetupPlayoffs(){\n  const F=G._nbaSeasonFlow;\n  if(!F||!F.finalStandings)return false;\n  const conf=v9Conf(G.team),rows=conf===\"東區\"?F.finalStandings.east:F.finalStandings.west;\n  const seed=v9Seed(G.team);\n  if(seed>8)return false;\n  const oppSeed={1:8,8:1,2:7,7:2,3:6,6:3,4:5,5:4}[seed];\n  const opp=rows[oppSeed-1].team;\n  let semiPair,otherHalf;\n  if([1,8].includes(seed)){semiPair=[4,5];otherHalf=[[2,7],[3,6]];}\n  else if([4,5].includes(seed)){semiPair=[1,8];otherHalf=[[2,7],[3,6]];}\n  else if([2,7].includes(seed)){semiPair=[3,6];otherHalf=[[1,8],[4,5]];}\n  else {semiPair=[2,7];otherHalf=[[1,8],[4,5]];}\n  const semiOpp=v9AiWinner(rows[semiPair[0]-1].team,rows[semiPair[1]-1].team);\n  const h1=v9AiWinner(rows[otherHalf[0][0]-1].team,rows[otherHalf[0][1]-1].team);\n  const h2=v9AiWinner(rows[otherHalf[1][0]-1].team,rows[otherHalf[1][1]-1].team);\n  const confOpp=v9AiWinner(h1,h2);\n  const otherRows=conf===\"東區\"?F.finalStandings.west:F.finalStandings.east;\n  const finalsOpp=v9OtherChampion(otherRows);\n  G._v9Playoffs={\n    conf,seed,semiOpp,confOpp,finalsOpp,history:[],\n    current:{stage:\"first\",label:conf+\"季後賽第一輪\",opp,oppSeed,wins:0,losses:0,games:[]}\n  };\n  F.currentSeries=G._v9Playoffs.current;\n  G._seasonStage=\"playoffs\";G.phase=\"nbaPlayoffs\";\n  return true;\n}\nfunction v9PlayoffLine(){\n  const s=(G._nbaSeasonFlow&&G._nbaSeasonFlow.regular)||{};\n  const ppg=s.ppg||20,rpg=s.rpg||5,apg=s.apg||4;\n  return {\n    pts:Math.max(4,Math.round(ppg*v9Rand(v9Hash(G.year+\"|\"+G._v9Playoffs.current.games.length+\"|p\"),.68,1.52)+(overall()-80)*.15)),\n    reb:Math.max(1,Math.round(rpg*v9Rand(v9Hash(G.year+\"|r|\"+G._v9Playoffs.current.games.length),.65,1.45))),\n    ast:Math.max(0,Math.round(apg*v9Rand(v9Hash(G.year+\"|a|\"+G._v9Playoffs.current.games.length),.62,1.48)))\n  };\n}\nfunction v9SeriesGameFeel(win,us,them,home,gno){\n  const diff=Math.abs((us||0)-(them||0));\n  let pool;\n  if(win){\n    if(diff>=18)pool=[\"一路壓制對手\",\"火力全開輕鬆收下\",\"整場主導比賽\",\"打出一面倒內容\"];\n    else if(diff>=10)pool=[\"穩穩收下勝利\",\"下半場成功拉開差距\",\"攻守兩端更完整\",\"逐步掌握比賽節奏\"];\n    else if(diff>=5)pool=[\"拉鋸戰中成功勝出\",\"末節守住優勢\",\"關鍵幾波處理更好\",\"決勝節順利拉開\"];\n    else pool=[\"關鍵時刻守住勝利\",\"驚險收下勝利\",\"最後幾波頂住壓力\",\"決勝回合把握更好\"];\n  }else{\n    if(diff>=18)pool=[\"被對手全面壓制\",\"整場陷入苦戰\",\"攻守兩端都失去主動\",\"比賽很早就被拉開\"];\n    else if(diff>=10)pool=[\"下半場被對手拉開\",\"末節未能咬住比數\",\"節奏逐漸落入對手手中\",\"關鍵一節遭遇亂流\"];\n    else if(diff>=5)pool=[\"拉鋸戰末段失手\",\"決勝節遭到反超\",\"幾個關鍵回合沒把握住\",\"最後一波被對手帶走\"];\n    else pool=[\"惜敗於關鍵回合\",\"最後一波未能逆轉\",\"末段差一步追平\",\"關鍵球處理略遜一籌\"];\n  }\n  const idx=v9Hash(\"feel|\"+G.year+\"|\"+G.team+\"|\"+gno+\"|\"+us+\"|\"+them+\"|\"+(home?1:0))%pool.length;\n  return pool[idx];\n}\nfunction v9PlayOneGame(){\n  const P=G._v9Playoffs,F=G._nbaSeasonFlow;\n  if(!P||!P.current)return;\n  const c=P.current,gno=c.games.length+1;\n  const mySeed=v9Seed(G.team),opSeed=v9Seed(c.opp);\n  const better=mySeed<=opSeed;\n  const homeGames=better?[1,2,5,7]:[3,4,6];\n  const home=homeGames.includes(gno);\n  const line=v9PlayoffLine();\n  const p=v9Clamp(.50+(v9TeamPower(G.team)-v9TeamPower(c.opp))/31+(home?.045:-.025)+(overall()-82)*.004,.12,.90);\n  const win=chance(p);\n  const base=v9Int(v9Hash(c.opp+\"|\"+gno+\"|\"+G.year),98,119);\n  const us=base+(win?v9Int(v9Hash(\"u\"+gno+G.year),2,12):-v9Int(v9Hash(\"ul\"+gno+G.year),1,10));\n  const them=base+(win?-v9Int(v9Hash(\"t\"+gno+G.year),0,8):v9Int(v9Hash(\"tw\"+gno+G.year),2,12));\n  if(win)c.wins++;else c.losses++;\n  const clutch=v9SeriesGameFeel(win,us,them,home,gno);\n  c.games.push({n:gno,home,win,us,them,line,clutch});\n  v9RecordGame(line);\n\n  if(c.wins<4&&c.losses<4)return render();\n\n  P.history.push({...c});\n  F.playoffLog=F.playoffLog||[];\n  F.playoffLog.push({round:c.label,opp:c.opp,win:c.wins===4,score:c.wins+\"-\"+c.losses});\n\n  if(c.losses===4){\n    F.currentSeries=null;P.current=null;\n    G._v9PendingOffseason=true;\n    return V9_OLD_END_SEASON();\n  }\n\n  if(c.stage===\"first\"){\n    P.current={stage:\"semi\",label:P.conf+\"準決賽\",opp:P.semiOpp,oppSeed:v9Seed(P.semiOpp),wins:0,losses:0,games:[]};\n  }else if(c.stage===\"semi\"){\n    P.current={stage:\"conf\",label:P.conf+\"冠軍賽\",opp:P.confOpp,oppSeed:v9Seed(P.confOpp),wins:0,losses:0,games:[]};\n  }else if(c.stage===\"conf\"){\n    P.current={stage:\"final\",label:\"NBA 總冠軍賽\",opp:P.finalsOpp,oppSeed:v9Seed(P.finalsOpp),wins:0,losses:0,games:[]};\n  }else{\n    F.regular.playoff=true;F.regular.champion=true;\n    G.careerAwards[\"冠軍\"]=(G.careerAwards[\"冠軍\"]||0)+1;\n    try{logAward(\"NBA\",\"冠軍\",G.year);}catch(e){}\n    const avg=P.history.concat([c]).flatMap(x=>x.games).reduce((z,g)=>z+g.line.pts,0)/\n      Math.max(1,P.history.concat([c]).flatMap(x=>x.games).length);\n    if(avg>=25||overall()>=92){\n      F.regular.fmvp=true;\n      G.careerAwards.FMVP=(G.careerAwards.FMVP||0)+1;\n      try{logAward(\"NBA\",\"FMVP\",G.year);}catch(e){}\n    }\n    G._v9World.champions.push({year:G.year,team:G.team,fmvp:!!F.regular.fmvp});\n    F.currentSeries=null;P.current=null;\n    G._v9PendingOffseason=true;\n    return V9_OLD_END_SEASON();\n  }\n  F.currentSeries=P.current;\n  render();\n}\nfunction v9BracketHTML(){\n  const F=G._nbaSeasonFlow;if(!F||!F.finalStandings)return \"\";\n  function side(rows,name){\n    const pairs=[[1,8],[4,5],[2,7],[3,6]];\n    return '<div style=\"margin:9px 0\"><div class=\"label\">'+name+'</div>'\n      +pairs.map(p=>'<div class=\"small\" style=\"display:grid;grid-template-columns:1fr 30px 1fr;gap:4px;padding:6px;background:#0d1626;border:1px solid var(--line);border-radius:8px;margin-top:4px\">'\n        +'<span>#'+p[0]+' '+v9Esc(rows[p[0]-1].team)+'</span><b style=\"text-align:center\">VS</b><span style=\"text-align:right\">#'+p[1]+' '+v9Esc(rows[p[1]-1].team)+'</span></div>').join('')+'</div>';\n  }\n  return '<div class=\"panel\"><div class=\"label\">NBA PLAYOFF BRACKET · TOP 16</div>'\n    +side(F.finalStandings.east,\"EAST 東區\")+side(F.finalStandings.west,\"WEST 西區\")+'</div>';\n}\nfunction v9RenderPlayoffs(){\n  if(!G._v9Playoffs){\n    if(!v9SetupPlayoffs()){return V9_OLD_END_SEASON();}\n  }\n  const P=G._v9Playoffs,c=P.current;\n  let body=v9BracketHTML();\n  if(P.history.length){\n    body+='<div class=\"panel\"><div class=\"label\">已完成系列賽</div>'\n      +P.history.map(x=>'<div class=\"small\" style=\"padding:6px 0;border-bottom:1px solid var(--line)\">'+v9Esc(x.label)+'｜vs '+v9Esc(x.opp)+'｜<b style=\"color:'+(x.wins===4?'var(--green)':'var(--red)')+'\">'+x.wins+'-'+x.losses+'</b></div>').join('')\n      +'</div>';\n  }\n  if(c){\n    const next=c.games.length+1;\n    const game7=next===7;\n    body+='<div class=\"panel\" style=\"border-color:var(--gold)\"><div class=\"label\">'+v9Esc(c.label)+'</div>'\n      +'<h2 style=\"margin:6px 0 tailCost(v);\n  const added=A.add[k]||0;\n  const canPlus=v93CanAdd(A,k);\n  const canMinus=added>0;\n  const g=v93GroupOf(k);\n  const groupUsed=v93GroupUsed(A,g);\n  const groupLimit=v93GroupLimit(A,g);\n\n  return '<div style=\"display:grid;grid-template-columns:78px 1fr 52px 70px;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05)\">'\n    +'<div style=\"font-size:11px;color:var(--dim)\">'+HL_DETAIL_LABELS[k]+'</div>'\n    +'<div><div style=\"height:6px;background:#0c1526;border-radius:999px;overflow:hidden\"><i style=\"display:block;height:100%;width:'+v+'%;background:linear-gradient(90deg,var(--orange2),var(--orange));border-radius:999px\"></i></div>'\n    +'<div style=\"font-size:9px;color:var(--faint);margin-top:3px\">耗 '+c+'｜本項 '+added+'/'+((A._v93&&A._v93.skillLimit)||V93_SKILL_LIMIT)+'｜本組 '+groupUsed+'/'+groupLimit+'</div></div>'\n    +'<div style=\"font-family:Oswald;font-weight:800;text-align:center\">'+v+(added?'<span style=\"font-size:9px;color:var(--green)\"> +'+added+'</span>':'')+'</div>'\n    +'<div style=\"display:flex;gap:4px\"><button class=\"stp\" data-hld-minus=\"'+k+'\" '+(canMinus?'':'disabled')+'>−</button>'\n    +'<button class=\"stp plus\" data-hld-plus=\"'+k+'\" '+(canPlus?'':'disabled')+'>＋</button></div>'\n    +'</div>';\n};\n\nwindow.hlDetailAllocateHTML=function(){\n  const A=v93GetAlloc();\n  if(!A)return '';\n\n  const stageName=G.stage===\"高中\"\n    ? \"高中 \"+([\"高一\",\"高二\",\"高三\"][Math.max(0,(G.grade||1)-1)]||\"\")\n    : G.stage===\"大學\"\n      ? lname(G.league)+\" \"+([\"大一\",\"大二\",\"大三\",\"大四\"][Math.min((G.collegeYears||1)-1,3)]||\"\")\n      : lname(G.league);\n\n  const groupOrder=[\n    [\"offense\",V93_GROUP_NAMES.offense],\n    [\"playmaking\",V93_GROUP_NAMES.playmaking],\n    [\"defense\",V93_GROUP_NAMES.defense],\n    [\"rebound\",V93_GROUP_NAMES.rebound],\n    [\"physical\",V93_GROUP_NAMES.physical],\n    [\"iq\",V93_GROUP_NAMES.iq],\n  ];\n\n  const groups=groupOrder.map(function
