<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hardwood Life · Talent Rarity + Always Six</title>
<style>
html,body{
  margin:0;
  min-height:100%;
  background:#0b1220;
  color:#f4f2ec;
  font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif
}
#loading{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  text-align:center;
  box-sizing:border-box;
  line-height:1.7
}
</style>
</head>
<body>
<div id="loading">正在載入 Hardwood Life「天才稀有度＋骰子固定 6」版本…</div>

<script>
(async()=>{
  const SOURCE='https://raw.githubusercontent.com/a3283249-droid/hardwood-life/main/index.html';

  try{
    const res=await fetch(SOURCE,{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);

    let source=await res.text();

    /* =========================================================
       1. 骰子永遠為 6
       ========================================================= */
    source=source.replace(/rint\s*\(\s*1\s*,\s*6\s*\)/g,'6');

    /* =========================================================
       2. 建立角色時依天才類型追加起始能力
       ========================================================= */
    source=source.replace(
      /ATTR_KEYS\.forEach\(k=>attr\[k\]=clamp\(Math\.round\(t\[k\]\*\.94\+rnd\(-5,5\)\),18,58\)\);/,
      `ATTR_KEYS.forEach(k=>attr[k]=clamp(Math.round(t[k]*.94+rnd(-5,5)),18,58));
      {
        const tt=window.__TALENT_TYPE__||"normal";
        const buffs={
          scorer:{shooting:11,three:5,athletic:3,iq:2},
          sniper:{three:13,shooting:5,iq:3},
          rebounder:{rebound:14,defense:6,athletic:4},
          playmaker:{pass:12,iq:9,shooting:2},
          lockdown:{defense:13,athletic:6,iq:4,rebound:2},
          athlete:{athletic:14,defense:4,rebound:4,shooting:2},
          pointgod:{pass:11,iq:9,three:7,shooting:3},
          twoway:{shooting:7,defense:9,athletic:6,iq:4},
          allround:{shooting:7,three:7,pass:7,defense:7,rebound:7,athletic:7,iq:7},
          chosen:{shooting:8,three:8,pass:8,defense:8,rebound:8,athletic:8,iq:8}
        };
        const b=buffs[tt];
        if(b){
          for(const k in b){
            if(k in attr) attr[k]=clamp(attr[k]+b[k],18,82);
          }
        }
      }`
    );

    /* =========================================================
       3. 潛力依稀有度固定
       ========================================================= */
    source=source.replace(
      /potential:\(function\(\)\{let p=rint\(68,80\);if\(chance\(\.12\)\)p\+=rint\(6,15\);return clamp\(p,68,99\);\}\)\(\)/,
      `potential:(function(){
        const tt=window.__TALENT_TYPE__||"normal";
        const pm={
          scorer:91,
          sniper:91,
          rebounder:91,
          playmaker:94,
          lockdown:94,
          athlete:96,
          pointgod:96,
          twoway:96,
          allround:98,
          chosen:99
        };
        if(pm[tt]) return pm[tt];
        let p=rint(68,80);
        if(chance(.12))p+=rint(6,15);
        return clamp(p,68,99);
      })()`
    );

    /* =========================================================
       4. 把天賦資料存進角色
       ========================================================= */
    source=source.replace(
      /name,pos,home,jersey:jn,/,
      `name,pos,home,jersey:jn,
      talentType:(window.__TALENT_TYPE__||"normal"),
      talentRarity:(window.__TALENT_RARITY__||"一般"),`
    );

    /* =========================================================
       5. 稀有度影響每季訓練點
       A +1 / S +2 / SS +3 / 傳奇 +4
       ========================================================= */
    source=source.replace(
      /return base \+ rint\(0,2\);/,
      `const rarityBonus={
        "一般":0,
        "A":1,
        "S":2,
        "SS":3,
        "傳奇":4
      }[G.talentRarity||"一般"]||0;
      return base + rint(0,2) + rarityBonus;`
    );

    /* =========================================================
       6. 額外專屬成長效果
       在每次季前加點開始時給對應能力微量成長
       ========================================================= */
    source=source.replace(
      /function beginAllocate\(\)\{\s*let sp=computeSP\(\);/,
      `function beginAllocate(){
      if(G && G.attr){
        const tt=G.talentType||"normal";
        const growth={
          scorer:{shooting:1},
          sniper:{three:1},
          rebounder:{rebound:1},
          playmaker:{pass:1,iq:1},
          lockdown:{defense:1},
          athlete:{athletic:1},
          pointgod:{pass:1,three:1},
          twoway:{shooting:1,defense:1},
          allround:{iq:1,athletic:1},
          chosen:{shooting:1,pass:1,defense:1,athletic:1}
        }[tt];

        if(growth){
          for(const k in growth){
            if(k in G.attr){
              G.attr[k]=Math.min(99,G.attr[k]+growth[k]);
            }
          }
        }
      }

      let sp=computeSP();`
    );

    /* =========================================================
       7. 建角畫面加入 10 種天才選擇
       ========================================================= */
    const talentUI=`
<script>
window.__TALENT_TYPE__='normal';
window.__TALENT_RARITY__='一般';

(function(){

  const TALENTS=[
    {
      id:'normal',
      rarity:'一般',
      name:'⚪ 一般選手',
      detail:'原版隨機潛力與成長',
      color:'#9DB0CC'
    },

    {
      id:'scorer',
      rarity:'A',
      name:'🔥 得分機器',
      detail:'潛力 91｜得分 +11｜三分 +5｜每季得分額外 +1',
      color:'#4DA3FF'
    },
    {
      id:'sniper',
      rarity:'A',
      name:'🎯 神射手',
      detail:'潛力 91｜三分 +13｜得分 +5｜每季三分額外 +1',
      color:'#4DA3FF'
    },
    {
      id:'rebounder',
      rarity:'A',
      name:'🧲 籃板怪獸',
      detail:'潛力 91｜籃板 +14｜防守 +6｜每季籃板額外 +1',
      color:'#4DA3FF'
    },

    {
      id:'playmaker',
      rarity:'S',
      name:'🧠 球場魔術師',
      detail:'潛力 94｜組織 +12｜球商 +9｜每季組織、球商 +1',
      color:'#A66CFF'
    },
    {
      id:'lockdown',
      rarity:'S',
      name:'🛡️ 防守怪物',
      detail:'潛力 94｜防守 +13｜體能 +6｜每季防守額外 +1',
      color:'#A66CFF'
    },

    {
      id:'athlete',
      rarity:'SS',
      name:'🚀 運動怪物',
      detail:'潛力 96｜體能 +14｜防守/籃板 +4｜每季體能 +1',
      color:'#FF6A2C'
    },
    {
      id:'pointgod',
      rarity:'SS',
      name:'👑 控衛之神',
      detail:'潛力 96｜組織 +11｜球商 +9｜三分 +7｜每季組織、三分 +1',
      color:'#FF6A2C'
    },
    {
      id:'twoway',
      rarity:'SS',
      name:'⚔️ 攻防一體',
      detail:'潛力 96｜得分 +7｜防守 +9｜體能 +6｜每季得分、防守 +1',
      color:'#FF6A2C'
    },

    {
      id:'allround',
      rarity:'傳奇',
      name:'🃏 全能天才',
      detail:'潛力 98｜所有能力 +7｜每季球商、體能 +1｜訓練點 +4',
      color:'#F2B84B'
    },
    {
      id:'chosen',
      rarity:'傳奇',
      name:'🌟 天選之子',
      detail:'潛力 99｜所有能力 +8｜每季得分、組織、防守、體能 +1｜訓練點 +4',
      color:'#F2B84B'
    }
  ];

  function addSelector(){
    if(document.getElementById('talent-selector')) return;

    const buttons=[...document.querySelectorAll('button')];
    const startBtn=buttons.find(b=>
      /開始|建立|生涯|出發|開啟/.test((b.textContent||'').trim())
    );

    if(!startBtn) return;

    const box=document.createElement('div');
    box.id='talent-selector';

    box.style.cssText=
      'margin:12px 0;padding:12px;border:1px solid #2A3A57;border-radius:14px;background:#0d1626';

    box.innerHTML=
      '<div style="font-weight:900;font-size:16px;margin-bottom:3px">🌟 選擇球員天賦</div>'+
      '<div style="font-size:11px;color:#9DB0CC;margin-bottom:10px">'+
      '稀有度越高，起始能力、潛力與每季成長越強。'+
      '</div>'+
      '<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px">'+
      '<span style="font-size:10px;color:#9DB0CC">一般</span>'+
      '<span style="font-size:10px;color:#4DA3FF">A</span>'+
      '<span style="font-size:10px;color:#A66CFF">S</span>'+
      '<span style="font-size:10px;color:#FF6A2C">SS</span>'+
      '<span style="font-size:10px;color:#F2B84B">傳奇</span>'+
      '</div>'+
      '<div id="talent-list" style="display:grid;grid-template-columns:1fr 1fr;gap:7px"></div>'+
      '<div id="talent-desc" style="margin-top:10px;padding:10px;border-radius:10px;background:#131E33;color:#9DB0CC;font-size:11px;line-height:1.5">'+
      '目前：一般選手'+
      '</div>';

    const list=box.querySelector('#talent-list');
    const desc=box.querySelector('#talent-desc');

    function selectTalent(t){
      window.__TALENT_TYPE__=t.id;
      window.__TALENT_RARITY__=t.rarity;

      [...list.querySelectorAll('button')].forEach(btn=>{
        const on=btn.dataset.id===t.id;
        const data=TALENTS.find(x=>x.id===btn.dataset.id);
        btn.style.borderColor=on?data.color:'#2A3A57';
        btn.style.boxShadow=on?'0 0 0 1px '+data.color+', 0 0 14px '+data.color+'55':'none';
        btn.style.background=on?'#1B2842':'#131E33';
      });

      desc.innerHTML=
        '<div style="font-weight:900;color:'+t.color+'">'+
        '['+t.rarity+'] '+t.name+
        '</div>'+
        '<div style="margin-top:4px">'+t.detail+'</div>'+
        '<div style="margin-top:4px;color:#F2B84B">'+
        '每季訓練點加成：+'+
        ({'一般':0,'A':1,'S':2,'SS':3,'傳奇':4}[t.rarity]||0)+
        '</div>';
    }

    TALENTS.forEach(t=>{
      const btn=document.createElement('button');

      btn.type='button';
      btn.dataset.id=t.id;

      btn.style.cssText=
        'padding:10px 6px;border:1px solid #2A3A57;border-radius:10px;'+
        'background:#131E33;color:#F4F2EC;font-weight:700;font-size:12px;line-height:1.3;text-align:center';

      btn.innerHTML=
        '<div style="font-size:9px;color:'+t.color+';font-weight:900;margin-bottom:2px">'+
        t.rarity+
        '</div>'+
        '<div>'+t.name+'</div>';

      btn.onclick=()=>selectTalent(t);

      list.appendChild(btn);
    });

    startBtn.parentElement.insertBefore(box,startBtn);

    selectTalent(TALENTS[0]);
  }

  addSelector();

  new MutationObserver(addSelector).observe(
    document.documentElement,
    {childList:true,subtree:true}
  );

})();
<\/script>`;

    source=source.replace(/<\/body>/i,talentUI+'\n</body>');

    /* 原遊戲相對資源仍以原網站為基準 */
    if(!/<base[\s>]/i.test(source)){
      source=source.replace(
        /<head([^>]*)>/i,
        '<head$1><base href="https://a3283249-droid.github.io/hardwood-life/">'
      );
    }

    document.open();
    document.write(source);
    document.close();

  }catch(err){
    document.getElementById('loading').innerHTML=
      '載入失敗：'+String(err.message)+
      '<br><br>請確認網路連線後重新整理。';
  }
})();
</script>

</body>
</html>
