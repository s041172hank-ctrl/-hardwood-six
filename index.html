<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hardwood Life · NBA 球隊需求選秀版</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#0b1220;color:#f4f2ec;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
body{min-height:100vh;background:radial-gradient(900px 500px at 50% -10%,#1c2f51 0%,transparent 60%),#0b1220}
#talent-screen{max-width:520px;margin:0 auto;padding:22px 14px 40px}
.hero{text-align:center;padding:12px 8px 18px}
.hero h1{font-size:27px;margin:0 0 7px}
.hero p{margin:0;color:#9db0cc;font-size:13px;line-height:1.55}
.mode-box{margin-bottom:14px;padding:12px;border:1px solid #2a3a57;border-radius:14px;background:#101a2d}
.mode-title{font-weight:900;font-size:15px;margin-bottom:8px}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode-btn{border:1px solid #2a3a57;border-radius:11px;background:#131e33;color:#f4f2ec;padding:11px 8px;font-weight:800;font-size:12px}
.mode-btn.on{border-color:#f2b84b;box-shadow:0 0 14px rgba(242,184,75,.25)}
.mode-desc{font-size:10.5px;color:#9db0cc;margin-top:8px;line-height:1.5}
.legend{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:11px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.card{border:1px solid #2a3a57;background:#131e33;border-radius:14px;padding:11px 9px;color:#f4f2ec;text-align:left;min-height:92px}
.card .rarity{font-size:10px;font-weight:900;margin-bottom:3px}
.card .name{font-size:14px;font-weight:900}
.card .desc{font-size:10.5px;line-height:1.4;color:#9db0cc;margin-top:5px}
.card.on{background:#1b2842;transform:translateY(-1px)}
#selected{margin:12px 0;background:#101a2d;border:1px solid #2a3a57;border-radius:13px;padding:12px;font-size:12px;line-height:1.6;color:#9db0cc}
#selected b{font-size:15px}
#go{width:100%;border:0;border-radius:13px;background:#ff6a2c;color:#1c0d04;font-size:16px;font-weight:900;padding:14px}
#go:disabled{opacity:.5}
#loading{display:none;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:24px;line-height:1.7}
.person-box{margin:14px 0;padding:12px;border:1px solid #2a3a57;border-radius:14px;background:#101a2d}
.person-title{font-weight:900;font-size:15px;margin-bottom:8px}
.person-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.person-btn{border:1px solid #2a3a57;border-radius:10px;background:#131e33;color:#f4f2ec;padding:9px 7px;font-size:11px;font-weight:800;text-align:left}
.person-btn.on{border-color:#4DA3FF;box-shadow:0 0 12px rgba(77,163,255,.25);background:#1b2842}
.person-note{font-size:10.5px;color:#9db0cc;line-height:1.5;margin-top:8px}

</style>
</head>
<body>

<div id="talent-screen">
  <div class="hero">
    <h1>🌟 Hardwood Life 改造版</h1>
    <p>天才類型＋NBA 球隊需求選秀。<br>事件骰子仍固定為 6。</p>
  </div>

  <div class="mode-box">
    <div class="mode-title">🏀 生涯起點</div>
    <div class="mode-grid">
      <button id="mode-normal" class="mode-btn on" type="button">🏫 正常高中開始</button>
      <button id="mode-nba" class="mode-btn" type="button">🇺🇸 挑戰 NBA 選秀</button>
    </div>
    <div id="mode-desc" class="mode-desc">
      正常模式：從高中開始，照原版生涯流程遊玩。
    </div>
  </div>

  <div class="hero" style="padding-top:2px">
    <h1 style="font-size:22px">選擇球員天賦</h1>
    <div class="legend">
      <span style="color:#9DB0CC">一般</span>
      <span style="color:#4DA3FF">A</span>
      <span style="color:#A66CFF">S</span>
      <span style="color:#FF6A2C">SS</span>
      <span style="color:#F2B84B">傳奇</span>
    </div>
  </div>

  <div id="cards" class="grid"></div>

  <div class="person-box">
    <div class="person-title">🧠 球員性格</div>
    <div id="person-grid" class="person-grid"></div>
    <div id="person-note" class="person-note">目前：🎲 隨機性格</div>
  </div>

  <div id="selected">尚未選擇</div>
  <button id="go" disabled>選好後進入遊戲 🏀</button>
</div>

<div id="loading">正在載入遊戲…</div>

<script>
const SOURCE='https://raw.githubusercontent.com/a3283249-droid/hardwood-life/main/index.html';

const TALENTS=[
  {id:'normal',rarity:'一般',name:'⚪ 一般選手',color:'#9DB0CC',
   desc:'原版隨機潛力',detail:'原版能力與隨機潛力。直接挑戰 NBA 時很可能落選。'},
  {id:'scorer',rarity:'A',name:'🔥 得分機器',color:'#4DA3FF',
   desc:'得分特化',detail:'潛力 91｜得分 +11｜三分 +5｜每季得分 +1｜訓練點 +1'},
  {id:'sniper',rarity:'A',name:'🎯 神射手',color:'#4DA3FF',
   desc:'外線特化',detail:'潛力 91｜三分 +13｜得分 +5｜每季三分 +1｜訓練點 +1'},
  {id:'rebounder',rarity:'A',name:'🧲 籃板怪獸',color:'#4DA3FF',
   desc:'禁區籃板特化',detail:'潛力 91｜籃板 +14｜防守 +6｜每季籃板 +1｜訓練點 +1'},
  {id:'playmaker',rarity:'S',name:'🧠 球場魔術師',color:'#A66CFF',
   desc:'組織與球商',detail:'潛力 94｜組織 +12｜球商 +9｜每季組織、球商 +1｜訓練點 +2'},
  {id:'lockdown',rarity:'S',name:'🛡️ 防守怪物',color:'#A66CFF',
   desc:'鎖防特化',detail:'潛力 94｜防守 +13｜體能 +6｜每季防守 +1｜訓練點 +2'},
  {id:'athlete',rarity:'SS',name:'🚀 運動怪物',color:'#FF6A2C',
   desc:'爆發力與體能',detail:'潛力 96｜體能 +14｜防守/籃板 +4｜每季體能 +1｜訓練點 +3'},
  {id:'pointgod',rarity:'SS',name:'👑 控衛之神',color:'#FF6A2C',
   desc:'控場與外線',detail:'潛力 96｜組織 +11｜球商 +9｜三分 +7｜每季組織、三分 +1｜訓練點 +3'},
  {id:'twoway',rarity:'SS',name:'⚔️ 攻防一體',color:'#FF6A2C',
   desc:'攻防兼備',detail:'潛力 96｜得分 +7｜防守 +9｜體能 +6｜每季得分、防守 +1｜訓練點 +3'},
  {id:'allround',rarity:'傳奇',name:'🃏 全能天才',color:'#F2B84B',
   desc:'全面型怪物',detail:'潛力 98｜全部能力 +7｜每季球商、體能 +1｜訓練點 +4'},
  {id:'chosen',rarity:'傳奇',name:'🌟 天選之子',color:'#F2B84B',
   desc:'最頂級全能天賦',detail:'潛力 99｜全部能力 +8｜每季得分、組織、防守、體能 +1｜訓練點 +4'}
];


const PERSONALITIES=[
  {id:"random",name:"🎲 隨機性格",desc:"建角時隨機決定。"},
  {id:"leader",name:"👑 領袖",desc:"更衣室影響力強，士氣較穩定。"},
  {id:"quiet",name:"🧊 沉默殺手",desc:"少說多做，球商與關鍵表現更穩。"},
  {id:"competitor",name:"🔥 好勝",desc:"競爭心強，容易搶到更高球隊角色。"},
  {id:"loyal",name:"❤️ 忠誠",desc:"較願意留隊，也更容易獲得母隊續約。"},
  {id:"teamfirst",name:"🤝 團隊至上",desc:"組織與球商成長較順。"},
  {id:"confident",name:"😎 自信",desc:"名氣與進攻表現容易被放大。"},
  {id:"hothead",name:"💢 火爆",desc:"防守與對抗更強，但交易與更衣室風險較高。"}
];
let selectedPersonality="random";

let selected=null;
let startMode='normal';

const modeNormal=document.getElementById('mode-normal');
const modeNBA=document.getElementById('mode-nba');
const modeDesc=document.getElementById('mode-desc');

function setMode(mode){
  startMode=mode;
  modeNormal.classList.toggle('on',mode==='normal');
  modeNBA.classList.toggle('on',mode==='nba');
  modeDesc.innerHTML=mode==='nba'
    ? '<b style="color:#F2B84B">挑戰模式：</b>建角後直接參加 NBA 選秀，但不保證中選。球隊會看 OVR、潛力、天賦與「陣容需求契合度」。能力太低會落選。'
    : '正常模式：從高中開始，照原版生涯流程遊玩。';
}
modeNormal.onclick=()=>setMode('normal');
modeNBA.onclick=()=>setMode('nba');

const cards=document.getElementById('cards');
const selectedBox=document.getElementById('selected');
const go=document.getElementById('go');

const personGrid=document.getElementById('person-grid');
const personNote=document.getElementById('person-note');
for(const p of PERSONALITIES){
  const b=document.createElement('button');
  b.type='button';
  b.className='person-btn'+(p.id==="random"?' on':'');
  b.dataset.pid=p.id;
  b.innerHTML='<div>'+p.name+'</div><div style="font-weight:400;color:#9db0cc;margin-top:2px">'+p.desc+'</div>';
  b.onclick=()=>{
    selectedPersonality=p.id;
    personGrid.querySelectorAll('.person-btn').forEach(x=>x.classList.toggle('on',x.dataset.pid===p.id));
    personNote.textContent='目前：'+p.name+'｜'+p.desc;
  };
  personGrid.appendChild(b);
}

for(const t of TALENTS){
  const b=document.createElement('button');
  b.className='card';
  b.type='button';
  b.dataset.id=t.id;
  b.innerHTML=
    '<div class="rarity" style="color:'+t.color+'">'+t.rarity+'</div>'+
    '<div class="name">'+t.name+'</div>'+
    '<div class="desc">'+t.desc+'</div>';
  b.onclick=()=>{
    selected=t;
    document.querySelectorAll('.card').forEach(x=>{
      x.classList.toggle('on',x.dataset.id===t.id);
      const tx=TALENTS.find(y=>y.id===x.dataset.id);
      x.style.borderColor=x.dataset.id===t.id?tx.color:'#2a3a57';
      x.style.boxShadow=x.dataset.id===t.id?'0 0 14px '+tx.color+'55':'none';
    });
    selectedBox.innerHTML='<b style="color:'+t.color+'">['+t.rarity+'] '+t.name+'</b><br>'+t.detail;
    go.disabled=false;
    go.textContent='使用 '+t.name+' 開始遊戲 🏀';
  };
  cards.appendChild(b);
}

function escJs(s){
  return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
}

go.onclick=async()=>{
  if(!selected)return;

  document.getElementById('talent-screen').style.display='none';
  const loading=document.getElementById('loading');
  loading.style.display='flex';
  loading.textContent='正在載入 '+selected.name+'…';

  try{
    const res=await fetch(SOURCE,{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    let source=await res.text();

    // 1) 事件骰子固定 6
    source=source.replace(/rint\s*\(\s*1\s*,\s*6\s*\)/g,'6');

    // 2) 起始能力加成
    source=source.replace(
      /ATTR_KEYS\.forEach\(k=>attr\[k\]=clamp\(Math\.round\(t\[k\]\*\.94\+rnd\(-5,5\)\),18,58\)\);/,
      `ATTR_KEYS.forEach(k=>attr[k]=clamp(Math.round(t[k]*.94+rnd(-5,5)),18,58));
      {
        const tt=window.__TALENT_TYPE__||"normal";
        const buffs={
          scorer:{shooting:11,three:5,athletic:3,iq:2},
          sniper:{three:13,shooting:5,iq:3},
          rebounder:{rebound:14,defense:6,athletic:4},
          playmaker:{pass:12,iq:9,shooting:2},
          lockdown:{defense:13,athletic:6,iq:4,rebound:2},
          athlete:{athletic:14,defense:4,rebound:4,shooting:2},
          pointgod:{pass:11,iq:9,three:7,shooting:3},
          twoway:{shooting:7,defense:9,athletic:6,iq:4},
          allround:{shooting:7,three:7,pass:7,defense:7,rebound:7,athletic:7,iq:7},
          chosen:{shooting:8,three:8,pass:8,defense:8,rebound:8,athletic:8,iq:8}
        };
        const b=buffs[tt];
        if(b)for(const k in b)if(k in attr)attr[k]=clamp(attr[k]+b[k],18,82);
      }`
    );

    // 3) 潛力
    source=source.replace(
      /potential:\(function\(\)\{let p=rint\(68,80\);if\(chance\(\.12\)\)p\+=rint\(6,15\);return clamp\(p,68,99\);\}\)\(\)/,
      `potential:(function(){
        const tt=window.__TALENT_TYPE__||"normal";
        const pm={scorer:91,sniper:91,rebounder:91,playmaker:94,lockdown:94,athlete:96,pointgod:96,twoway:96,allround:98,chosen:99};
        if(pm[tt])return pm[tt];
        let p=rint(68,80);if(chance(.12))p+=rint(6,15);return clamp(p,68,99);
      })()`
    );

    // 4) 天賦資料存檔
    source=source.replace(
      /name,pos,home,jersey:jn,/,
      `name,pos,home,jersey:jn,
      talentType:(window.__TALENT_TYPE__||"normal"),
      talentRarity:(window.__TALENT_RARITY__||"一般"),
      talentName:(window.__TALENT_NAME__||"一般選手"),
      personality:(function(){ const p=window.__PERSONALITY__||"random"; if(p!=="random")return p; const a=["leader","quiet","competitor","loyal","teamfirst","confident","hothead"]; return a[rint(0,a.length-1)]; })(),`
    );

    // 5) 稀有度訓練點
    source=source.replace(
      /return base \+ rint\(0,2\);/,
      `const rarityBonus={"一般":0,"A":1,"S":2,"SS":3,"傳奇":4}[G.talentRarity||"一般"]||0;
      return base + rint(0,2) + rarityBonus;`
    );

    // 6) 每季專屬成長
    source=source.replace(
      /function beginAllocate\(\)\{\s*let sp=computeSP\(\);/,
      `function beginAllocate(){
      if(G&&G.attr){
        const growth={
          scorer:{shooting:1},sniper:{three:1},rebounder:{rebound:1},
          playmaker:{pass:1,iq:1},lockdown:{defense:1},athlete:{athletic:1},
          pointgod:{pass:1,three:1},twoway:{shooting:1,defense:1},
          allround:{iq:1,athletic:1},chosen:{shooting:1,pass:1,defense:1,athletic:1}
        }[G.talentType||"normal"];
        if(growth)for(const k in growth)if(k in G.attr)G.attr[k]=Math.min(99,G.attr[k]+growth[k]);
      }
      let sp=computeSP();`
    );

    // 7) 插入 NBA 球隊需求 / 契合度模型
    const teamNeedHelpers = `
function _nbaNeedCatalog(){
  return [
    {id:"shooter",name:"外線射手",score:a=>a.three*.72+a.shooting*.28},
    {id:"defender",name:"外圍防守型",score:a=>a.defense*.72+a.athletic*.28},
    {id:"playmaker",name:"助攻控球",score:a=>a.pass*.68+a.iq*.32},
    {id:"bench",name:"替補爆發得分",score:a=>a.shooting*.52+a.three*.25+a.athletic*.23},
    {id:"rim",name:"護框長人",score:(a,p)=>a.defense*.55+a.rebound*.28+a.athletic*.17+((p==="C"||p==="PF")?7:0)},
    {id:"rebound",name:"籃板手",score:a=>a.rebound*.75+a.athletic*.25},
    {id:"3d",name:"3&D",score:a=>a.three*.45+a.defense*.45+a.athletic*.10},
    {id:"wing",name:"側翼得分",score:(a,p)=>a.shooting*.52+a.athletic*.28+a.three*.20+((p==="SG"||p==="SF")?5:0)},
    {id:"secondary",name:"第二持球點",score:a=>a.pass*.48+a.shooting*.30+a.iq*.22},
    {id:"switchbig",name:"可換防內線",score:(a,p)=>a.defense*.42+a.athletic*.34+a.rebound*.24+((p==="PF"||p==="C")?5:0)}
  ];
}
function _nbaHash(s){
  let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h+s.charCodeAt(i))|0;
  return Math.abs(h);
}
function nbaNeedsForTeam(team){
  const c=_nbaNeedCatalog(),h=_nbaHash(team||"NBA");
  const a=c[h%c.length],b=c[(Math.floor(h/7)+3)%c.length];
  return a.id===b.id?[a]:[a,b];
}
function nbaFitForTeam(team){
  const ns=nbaNeedsForTeam(team),a=G.attr,p=G.pos;
  const vals=ns.map(n=>n.score(a,p));
  const fit=Math.round(vals.reduce((x,y)=>x+y,0)/vals.length);
  return {team,needs:ns.map(x=>x.name),fit};
}
function nbaCandidateTeams(){
  const seen=new Set(),arr=[];
  for(let i=0;i<80&&arr.length<14;i++){
    const t=randTeam("NBA");
    if(!seen.has(t)){seen.add(t);arr.push(nbaFitForTeam(t));}
  }
  return arr;
}
function nbaBestTeamForPlayer(){
  const arr=nbaCandidateTeams();
  arr.forEach(x=>x.board=x.fit+rnd(-4,7));
  arr.sort((a,b)=>b.board-a.board);
  return arr[0]||nbaFitForTeam(randTeam("NBA"));
}
function nbaDirectDraftScore(teamFit){
  const ov=overall();
  const rb={"一般":0,"A":8,"S":12,"SS":16,"傳奇":20}[G.talentRarity||"一般"]||0;
  const pot=Math.max(0,(G.potential-70)*.18);
  const fit=clamp((teamFit-48)*.28,-5,11);
  const posBonus=(G.pos==="PG"&&G.attr.pass>=58)?2:0;
  return Math.round(ov+rb+pot+fit+posBonus);
}
function nbaPickFromScore(score){
  if(score<68)return null;
  let lo,hi;
  if(score>=94){lo=1;hi=6;}
  else if(score>=90){lo=3;hi=10;}
  else if(score>=86){lo=6;hi=17;}
  else if(score>=81){lo=15;hi=30;}
  else if(score>=75){lo=28;hi=45;}
  else {lo=42;hi=58;}
  const strength=clamp((score-68)/28,0,1);
  return Math.round(clamp(hi-(hi-lo)*strength+rnd(-2,2),lo,hi));
}
`;
    source=source.replace(/function newGame\(/,teamNeedHelpers+'\nfunction newGame(');

    // 8) 直接挑戰 NBA：真實能力＋球隊需求決定，中選或落選
    source=source.replace(
      /G\.phase="intro"; render\(\); \/\/ 先看開場劇情，再進季前特訓/,
      `if(window.__START_MODE__==="nba"){
        G.age=19;
        G._combine=null;
        G.phase="nbaCombine";
        render();
      }else{
        G.phase="intro"; render();
      }`
    );


    // NBA 落選後的選秀結果頁改成「選擇下一站」
    source=source.replace(
      /const title=G\._draftMode\?"職業選秀 · 選擇下家":"自由市場 · 合約到期";/,
      `const title=G._nbaUndrafted?"NBA 落選 · 選擇下一站":(G._draftMode?"職業選秀 · 選擇下家":"自由市場 · 合約到期");`
    );

    // 9) 正常生涯裡原本的 NBA 選秀，也改成優先配到需求契合球隊
    source=source.replace(
      /team:randTeam\("NBA"\), pick:npick, years:rint\(2,4\),/,
      `team:nbaBestTeamForPlayer().team, pick:npick, years:rint(2,4),`
    );
    source=source.replace(
      /team:randTeam\("NBA"\), pick:npick, years:2,/,
      `team:nbaBestTeamForPlayer().team, pick:npick, years:2,`
    );


    // NBA 落選後選擇其他聯盟並簽約，記錄「落選逆襲」
    source=source.replace(
      /if\(offer\.pick===1\) grantTitle\("firstPick"\);/,
      `if(offer.pick===1) grantTitle("firstPick");
      if(G._nbaUndrafted && offer.league!=="NBA") grantTitle("undraftedHero");`
    );


    // ============================================================
    // 10) 多元傷病系統 + 擴充稱號
    // 傷病使用獨立 RNG，不受「事件骰子固定 6」影響
    // ============================================================

    // 10-1. 擴充稱號 / 標籤
    source=source.replace(
      /const TITLE_DEFS=\{/,
      `const TITLE_DEFS={
        /* --- 傷病類標籤 --- */
        fluBug:{name:"流感病號",good:false,desc:"曾因流感缺陣",effect:"—",buff:{}},
        glassAnkle:{name:"玻璃腳踝",good:false,desc:"腳踝曾出現明顯傷勢",effect:"—",buff:{}},
        hamstringAlert:{name:"腿後肌警報",good:false,desc:"腿後肌傷勢留下紀錄",effect:"—",buff:{}},
        concussionHistory:{name:"腦震盪史",good:false,desc:"曾因腦震盪進入觀察名單",effect:"—",buff:{}},

/* ===== 改造版：多元傷病系統 ===== */
const _baseSeasonInjuryCheck = seasonInjuryCheck;

function _hlPickWeighted(arr){
  const total=arr.reduce((s,x)=>s+(x.w||1),0);
  let r=_rng()*total;
  for(const x of arr){
    r-=x.w||1;
    if(r<=0)return x;
  }
  return arr[arr.length-1];
}

function _hlApplyMods(mods){
  if(!mods)return;
  for(const k in mods){
    if(k in G.attr) G.attr[k]=clamp(G.attr[k]+mods[k],15,99);
  }
}

function _hlRecordInjury(inj,miss,career){
  G.injuryHistory=G.injuryHistory||[];
  G.injuryHistory.push({
    year:G.year,
    age:G.age,
    league:G.league,
    team:G.team,
    key:inj.key,
    name:inj.name,
    severity:inj.major?"major":"minor",
    missGames:miss,
    career:!!career
  });

  if(inj.title)grantTitle(inj.title);

  const hist=G.injuryHistory;
  if(hist.length>=3)grantTitle("injuryProne");
  if(hist.filter(x=>x.severity==="major").length>=2)grantTitle("rehabRegular");
  if(hist.length>=6)grantTitle("hospitalVIP");
}

function _hlSeasonIdentityTags(){

seasonInjuryCheck=function(){

  }

  if(G._memInjury==="season" || G._memInjury==="career"){
    const forced=G._memInjury;
    G._memInjury=null;
    return _hlSpecificInjury(true,forced==="career"&&isPro());
  }

  // 獨立傷病率：骰子固定 6 也不影響
  let p=.22;
  if(G.age>=28)p+=(G.age-27)*.012;
  if(G.health<70)p+=.07;
  if(G.health<50)p+=.10;
  if((G.majorInjuries||0)>=2)p+=.035;
  p=clamp(p,.16,.52);

  if(chance(p)){
    return _hlSpecificInjury(false,false);
  }

  // 健康賽季：恢復一些健康並累積鐵人連續季
  G.health=clamp(G.health+rnd(4,11),0,100);
  G._healthyStreak=(G._healthyStreak||0)+1;
  if(G._healthyStreak>=3)grantTitle("ironBody");

  return null;
};

    source=source.replace(/<body([^>]*)>/i,'<body$1>'+badge);

    // 11-1) 結算畫面 V2：分聯盟 / 球員模板 / GOAT與位置排名
    const endScreenUpgrade = `<script>
(function(){
  function hlClamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function hlNum(v){v=Number(v);return Number.isFinite(v)?v:0;}
  function hlRound(v,d){const p=Math.pow(10,d||0);return Math.round(v*p)/p;}

  function hlLeagueDisplay(lg){
    const map={
      "NBA":"NBA",
      "發展聯盟":"NBA G League",
      "KRBL":"韓國聯賽",
      "日職 B.League":"日本 B.League",
      "CBL":"中國 CBL",
      "TPBL":"T 聯盟 / TPBL",
      "P+":"P.LEAGUE+",
      "SBL":"SBL",
      "NCAA D1":"NCAA D1",
      "NCAA D2":"NCAA D2",
      "UBA":"UBA",
      "高中":"高中"
    };
    return map[lg]||lg;
  }

  function hlLeagueOrder(){
    return ["NBA","發展聯盟","KRBL","日職 B.League","CBL","TPBL","P+","SBL","NCAA D1","NCAA D2","UBA","高中"];
  }

  function hlPresentLeagues(){
    const h=(G&&G.seasonHistory)||[];
    const set=new Set(h.map(function(s){return s.league;}));
    const arr=hlLeagueOrder().filter(function(lg){return set.has(lg);});
    h.forEach(function(s){if(s.league&&!arr.includes(s.league))arr.push(s.league);});
    return arr;
  }

  function hlLeagueSummary(lg){
    const rows=((G&&G.seasonHistory)||[]).filter(function(s){return s.league===lg;});
    const gp=rows.reduce(function(a,s){return a+hlNum(s.gp);},0);
    const weighted=function(key){
      if(!gp)return 0;
      return rows.reduce(function(a,s){return a+hlNum(s[key])*hlNum(s.gp);},0)/gp;
    };
    const totalPts=Math.round(rows.reduce(function(a,s){return a+hlNum(s.ppg)*hlNum(s.gp);},0));
    const teams=[];
    rows.forEach(function(s){if(s.team&&!teams.includes(s.team))teams.push(s.team);});
    const awards=((G&&G.awardLog)||[]).filter(function(a){return a.league===lg;});
    const countAward=function(name){return awards.filter(function(a){return a.award===name;}).length;};
    const peak=rows.length?Math.max.apply(null,rows.map(function(s){return hlNum(s.ov);})):0;
    const champs=rows.filter(function(s){return !!s.champion;}).length;
    const fmvp=rows.filter(function(s){return !!s.fmvp;}).length;
    return {
      league:lg,seasons:rows.length,gp:gp,totalPts:totalPts,
      ppg:hlRound(weighted("ppg"),1),rpg:hlRound(weighted("rpg"),1),apg:hlRound(weighted("apg"),1),
      spg:hlRound(weighted("spg"),1),bpg:hlRound(weighted("bpg"),1),
      fg:hlRound(weighted("fg"),1),tp:hlRound(weighted("tp"),1),peak:peak,
      champs:champs,fmvp:Math.max(fmvp,countAward("FMVP")),mvp:countAward("MVP"),
      teams:teams
    };
  }

  function hlLeagueTabsHTML(){
    const leagues=hlPresentLeagues();
    if(!leagues.length)return '<div class="small">沒有聯盟生涯紀錄。</div>';
    if(!G._hlEndLeague||!leagues.includes(G._hlEndLeague))G._hlEndLeague=leagues[0];
    let tabs='<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:7px;-webkit-overflow-scrolling:touch">';
    leagues.forEach(function(lg){
      const on=G._hlEndLeague===lg;
      tabs+='<button data-lg="'+encodeURIComponent(lg)+'" onclick="_hlSelectEndLeague(this.dataset.lg)" style="flex:0 0 auto;border:1px solid '+(on?'var(--gold)':'var(--line)')+';background:'+(on?'rgba(242,184,75,.14)':'#0d1626')+';color:'+(on?'var(--gold)':'var(--dim)')+';padding:7px 10px;border-radius:999px;font-size:11px;font-weight:800">'+hlLeagueDisplay(lg)+'</button>';
    });
    tabs+='</div>';

    const s=hlLeagueSummary(G._hlEndLeague);
    const honor=[];
    if(s.champs)honor.push('冠軍 ×'+s.champs);
    if(s.mvp)honor.push('MVP ×'+s.mvp);
    if(s.fmvp)honor.push('FMVP ×'+s.fmvp);
    const details='<div style="margin-top:7px;border:1px solid var(--line);border-radius:12px;padding:11px;background:#0d1626">'
      +'<div style="display:flex;justify-content:space-between;gap:8px"><div><div class="label">'+hlLeagueDisplay(s.league)+'</div><b style="font-size:17px">'+s.seasons+' 季 · '+s.gp+' 場</b></div><div style="text-align:right"><div class="label">巔峰 OVR</div><b style="font-family:Oswald;font-size:23px;color:var(--gold)">'+s.peak+'</b></div></div>'
      +'<div class="statline" style="margin-top:10px">'
      +'<div class="s"><div class="v">'+s.ppg+'</div><div class="l">PPG</div></div>'
      +'<div class="s"><div class="v">'+s.rpg+'</div><div class="l">RPG</div></div>'
      +'<div class="s"><div class="v">'+s.apg+'</div><div class="l">APG</div></div>'
      +'<div class="s"><div class="v">'+s.totalPts+'</div><div class="l">總得分</div></div>'
      +'</div>'
      +'<div class="small">命中率 '+s.fg+'%｜三分 '+s.tp+'%｜抄截 '+s.spg+'｜阻攻 '+s.bpg+'</div>'
      +'<div class="small" style="margin-top:5px">效力：'+(s.teams.length?s.teams.join(' → '):'—')+'</div>'
      +(honor.length?'<div class="small" style="margin-top:5px;color:var(--gold)">'+honor.join('｜')+'</div>':'')
      +'</div>';
    return tabs+details;
  }

  window._hlSelectEndLeague=function(encoded){
    G._hlEndLeague=decodeURIComponent(encoded||'');
    const old=document.getElementById('hl-career-resume');
    if(old)old.outerHTML=_hlCareerResumeHTML();
  };

  const HL_COMPS=[
    {n:"Stephen Curry",p:"PG",v:[93,99,87,70,55,83,95]},
    {n:"Magic Johnson",p:"PG",v:[84,67,99,82,84,86,98]},
    {n:"Chris Paul",p:"PG",v:[86,82,96,89,58,76,97]},
    {n:"Steve Nash",p:"PG",v:[88,94,97,63,54,74,96]},
    {n:"Russell Westbrook",p:"PG",v:[84,67,88,78,82,98,82]},
    {n:"Michael Jordan",p:"SG",v:[99,78,85,97,78,99,98]},
    {n:"Kobe Bryant",p:"SG",v:[97,84,82,91,72,94,95]},
    {n:"Dwyane Wade",p:"SG",v:[94,69,84,91,70,96,91]},
    {n:"James Harden",p:"SG",v:[96,90,94,68,68,83,92]},
    {n:"Klay Thompson",p:"SG",v:[87,97,70,92,60,79,88]},
    {n:"LeBron James",p:"SF",v:[96,79,97,90,86,99,99]},
    {n:"Kevin Durant",p:"SF",v:[99,94,86,80,78,90,95]},
    {n:"Larry Bird",p:"SF",v:[96,91,93,82,88,75,99]},
    {n:"Kawhi Leonard",p:"SF",v:[93,88,78,99,76,90,93]},
    {n:"Julius Erving",p:"SF",v:[92,73,80,87,82,98,90]},
    {n:"Tim Duncan",p:"PF",v:[91,63,82,98,97,86,99]},
    {n:"Kevin Garnett",p:"PF",v:[91,72,84,99,96,94,96]},
    {n:"Dirk Nowitzki",p:"PF",v:[98,94,77,73,83,74,97]},
    {n:"Giannis Antetokounmpo",p:"PF",v:[94,68,88,95,96,99,92]},
    {n:"Charles Barkley",p:"PF",v:[96,72,79,82,99,96,93]},
    {n:"Kareem Abdul-Jabbar",p:"C",v:[99,55,78,97,98,92,99]},
    {n:"Shaquille O'Neal",p:"C",v:[99,35,67,95,99,99,91]},
    {n:"Hakeem Olajuwon",p:"C",v:[95,58,76,100,97,96,98]},
    {n:"Nikola Jokic",p:"C",v:[97,86,99,81,97,74,100]},
    {n:"Wilt Chamberlain",p:"C",v:[99,40,77,96,100,100,92]}
  ];

  function hlCareerAverages(){
    const h=((G&&G.seasonHistory)||[]).filter(function(s){return s.stage==='pro';});
    const gp=h.reduce(function(a,s){return a+hlNum(s.gp);},0)||1;
    const w=function(k){return h.reduce(function(a,s){return a+hlNum(s[k])*hlNum(s.gp);},0)/gp;};
    return {ppg:w('ppg'),rpg:w('rpg'),apg:w('apg')};
  }

  function hlPlayerComp(){
    const a=G.attr||{};
    const cur=[hlNum(a.shooting),hlNum(a.three),hlNum(a.pass),hlNum(a.defense),hlNum(a.rebound),hlNum(a.athletic),hlNum(a.iq)];
    let best=null;
    HL_COMPS.forEach(function(c){
      let d=0;
      for(let i=0;i<cur.length;i++)d+=Math.pow(cur[i]-c.v[i],2);
      d=Math.sqrt(d/cur.length)+(c.p===G.pos?0:10);
      if(!best||d<best.d)best={c:c,d:d};
    });
    const av=hlCareerAverages();
    const strengths=[];
    if(a.three>=82)strengths.push('外線牽制');
    if(a.shooting>=84)strengths.push('自主得分');
    if(a.pass>=82||av.apg>=7.5)strengths.push('持球組織');
    if(a.defense>=84)strengths.push('防守影響力');
    if(a.rebound>=84||av.rpg>=9)strengths.push('籃板控制');
    if(a.athletic>=86)strengths.push('爆發力');
    if(a.iq>=86)strengths.push('比賽閱讀');
    if(!strengths.length)strengths.push('均衡球風');
    const sim=hlClamp(Math.round(100-best.d*.85),55,98);
    return {name:best.c.n,similarity:sim,reason:strengths.slice(0,3).join('＋')};
  }

  function hlLegacyScore(){
    const h=((G&&G.seasonHistory)||[]).filter(function(s){return s.stage==='pro';});
    const nba=h.filter(function(s){return s.league==='NBA';}).length;
    const peak=h.length?Math.max.apply(null,h.map(function(s){return hlNum(s.ov);})):overall();
    const gp=h.reduce(function(a,s){return a+hlNum(s.gp);},0);
    const pts=h.reduce(function(a,s){return a+hlNum(s.ppg)*hlNum(s.gp);},0);
    const avg=hlCareerAverages();
    const c=G.careerAwards||{};
    let score=peak*.38;
    score+=Math.min(18,h.length)*.55;
    score+=Math.min(18,nba)*.75;
    score+=Math.min(15,pts/2000);
    score+=Math.min(7,avg.ppg/5);
    score+=Math.min(3.5,avg.apg/3);
    score+=Math.min(3.5,avg.rpg/4);
    score+=hlNum(c.MVP)*6.5+hlNum(c.FMVP)*5.5+hlNum(c['冠軍'])*2.4+hlNum(c.DPOY)*4.2+hlNum(c['得分王'])*1.8+hlNum(c['助攻王'])*1.6+hlNum(c['籃板王'])*1.6;
    if(gp>=1000)score+=3;
    if(pts>=30000)score+=5;
    return hlClamp(hlRound(score,1),0,100);
  }

  function hlRankFromScore(score){
    if(score>=99)return 1;
    return Math.max(1,Math.round(1+Math.pow(Math.max(0,100-score),1.38)/1.7));
  }

  function hlPositionRank(score){
    let adj=score;
    const a=G.attr||{},av=hlCareerAverages();
    if(G.pos==='PG')adj+=(hlNum(a.pass)-75)*.045+Math.max(0,av.apg-6)*.35;
    if(G.pos==='SG')adj+=(hlNum(a.shooting)-75)*.04+Math.max(0,av.ppg-18)*.12;
    if(G.pos==='SF')adj+=(hlNum(a.iq)+hlNum(a.athletic)-150)*.025;
    if(G.pos==='PF')adj+=(hlNum(a.rebound)+hlNum(a.defense)-150)*.025;
    if(G.pos==='C')adj+=(hlNum(a.rebound)+hlNum(a.defense)-150)*.03;
    const overallRank=hlRankFromScore(hlClamp(adj,0,100));
    return Math.max(1,Math.round(overallRank/4.6));
  }

  function hlPositionReferenceHTML(){
    const refs={
      PG:["Magic Johnson","Stephen Curry","Oscar Robertson","John Stockton","Chris Paul"],
      SG:["Michael Jordan","Kobe Bryant","Dwyane Wade","James Harden","Jerry West"],
      SF:["LeBron James","Larry Bird","Kevin Durant","Julius Erving","Kawhi Leonard"],
      PF:["Tim Duncan","Karl Malone","Kevin Garnett","Dirk Nowitzki","Giannis Antetokounmpo"],
      C:["Kareem Abdul-Jabbar","Bill Russell","Wilt Chamberlain","Shaquille O'Neal","Hakeem Olajuwon"]
    };
    let out='<details style="margin-top:10px"><summary style="cursor:pointer;color:var(--dim);font-size:11px">查看五個位置的遊戲內名將參考榜</summary><div style="margin-top:7px">';
    Object.keys(refs).forEach(function(p){
      out+='<div class="small" style="padding:5px 0;border-bottom:1px solid var(--line)"><b style="color:'+(p===G.pos?'var(--gold)':'var(--ink)')+'">'+p+'</b>｜'+refs[p].join(' · ')+'</div>';
    });
    out+='</div><div class="small" style="margin-top:6px;color:var(--faint)">此榜為遊戲內預設名將基準，不代表現實世界官方排名。</div></details>';
    return out;
  }

  _hlCareerResumeHTML=function(){
    if(!G)return '';
    const h=G.seasonHistory||[];
    const teams=[];
    h.filter(function(s){return s.stage==='pro';}).forEach(function(s){if(s.team&&!teams.includes(s.team))teams.push(s.team);});
    const inj=G.injuryHistory||[];
    const tier=_hlCareerTier();
    const draft=G.draftInfo?(hlLeagueDisplay(G.draftInfo.league)+' '+(G.draftInfo.pick?('第 '+G.draftInfo.pick+' 順位'):'落選後簽約')):'未參加／無紀錄';
    const peak=h.length?Math.max.apply(null,h.map(function(s){return hlNum(s.ov);})):overall();
    const comp=hlPlayerComp();
    const legacy=hlLegacyScore();
    const goatRank=hlRankFromScore(legacy);
    const posRank=hlPositionRank(legacy);

    return '<div id="hl-career-resume">'
      +'<div class="panel" style="border-color:var(--gold)">'
      +'<div class="label">完整生涯履歷</div>'
      +'<h2 style="margin:7px 0;color:var(--gold)">'+tier[0]+'</h2>'
      +'<div class="small">名人堂評估：約 '+tier[1]+'%</div>'
      +'<div class="small" style="margin-top:8px">選秀：'+draft+'</div>'
      +'<div class="small">巔峰 OVR：'+peak+'</div>'
      +'<div class="small">效力球隊：'+(teams.length?teams.join(' → '):'—')+'</div>'
      +'<div class="small">生涯薪資：約 '+fmtMoney(G._careerSalary||0)+'</div>'
      +'<div class="small">重大傷病：'+inj.filter(function(x){return x.severity==='major';}).length+' 次｜全部傷病 '+inj.length+' 次</div>'
      +'<div class="small">最終性格：'+_hlPersonalityName(G.personality)+'</div>'
      +'</div>'

      +'<div class="panel"><div class="label">分聯盟生涯結算</div><div class="small" style="margin:4px 0 8px;color:var(--dim)">NBA、韓國、日本、T 聯盟等分開統計。</div>'+hlLeagueTabsHTML()+'</div>'

      +'<div class="panel" style="border-color:#4DA3FF">'
      +'<div class="label">球員模板比較</div>'
      +'<h2 style="margin:7px 0">最像 '+comp.name+'</h2>'
      +'<div class="small">球風相似度：約 '+comp.similarity+'%</div>'
      +'<div class="small" style="margin-top:5px;color:var(--dim)">主要原因：'+comp.reason+'</div>'
      +'</div>'

      +'<div class="panel" style="border-color:var(--gold)">'
      +'<div class="label">歷史地位 · 遊戲內模擬</div>'
      +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px">'
      +'<div style="background:#0d1626;border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center"><div class="label">GOAT 指數</div><b style="font-family:Oswald;font-size:24px;color:var(--gold)">'+legacy+'</b><div class="small">/100</div></div>'
      +'<div style="background:#0d1626;border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center"><div class="label">GOAT 總榜</div><b style="font-family:Oswald;font-size:24px">#'+goatRank+'</b><div class="small">歷史模擬</div></div>'
      +'<div style="background:#0d1626;border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center"><div class="label">'+G.pos+' 位置榜</div><b style="font-family:Oswald;font-size:24px;color:#4DA3FF">#'+posRank+'</b><div class="small">同位置</div></div>'
      +'</div>'
      +'<div class="small" style="margin-top:8px;color:var(--faint)">排名會綜合巔峰 OVR、職業年資、NBA 年資、總得分、場均數據、MVP、FMVP、冠軍與個人獎項；屬遊戲內模擬排名。</div>'
      +hlPositionReferenceHTML()
      +'</div>'
      +'</div>';
  };
})();
<\/script>`;
    source=source.replace(/<\/body>/i,endScreenUpgrade+'\n</body>');

    // 12) 相對資源
    if(!/<base[\s>]/i.test(source)){
      source=source.replace(
        /<head([^>]*)>/i,
        '<head$1><base href="https://a3283249-droid.github.io/hardwood-life/">'
